[package]
name = "zenfilters"
version = "0.1.1"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
description = "Photo filter operations on planar Oklab f32 data with SIMD acceleration"
repository = "https://github.com/imazen/zenpipe"
readme = "README.crates.md"
keywords = ["image", "filter", "oklab", "simd", "photo"]
categories = ["multimedia::images", "graphics"]
exclude = ["CLAUDE.md", "CONTEXT-HANDOFF.md", "FEEDBACK.md", ".claude/", ".superwork/", ".zenbench/", "copter-report/", ".github/", "Cross.toml", "justfile", "Cargo.toml.original.txt", "fuzz/"]

[lints.rust]
# CI strips some features — allow their cfg references to remain
unexpected_cfgs = { level = "allow" }

[features]
default = []
experimental = []
srgb-compat = []
serde = ["dep:serde", "dep:serde-big-array"]
srgb-filters = ["dep:rgb", "zenpixels/rgb"]
zennode = ["dep:zennode"]
# Use zenquant (perceptual OKLab quantizer) for ClipartFlatten's region palette
# instead of the built-in k-means. Opt-in (adds a dependency).
zenquant = ["dep:zenquant", "dep:rgb"]
# Dev-workstation-only fixtures for tests/quality_validation.rs (zenpipe#44):
# `local-fixtures` needs the CID22 corpus on disk; `local-vips` /
# `local-darktable` additionally need the `vips` / `darktable-cli` binaries.
# Missing prerequisites fail loudly — there are no runtime skips.
local-fixtures = []
local-vips = ["local-fixtures"]
local-darktable = ["local-fixtures"]

[dependencies]
archmage = { version = "0.9.17", features = ["avx512"] }
enough = "0.4.4"
serde = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }
serde-big-array = { version = "0.5.1", optional = true }
bytemuck = { version = "1.21", default-features = false, features = ["extern_crate_alloc"] }
linear-srgb = { version = "0.6.8" }
magetypes = { version = "0.9.17" }
rgb = { version = "0.8", default-features = false, features = ["bytemuck"], optional = true }
zenpixels = { version = ">=0.2.10, <0.4.0", features = ["planar"] }
whereat = { version = "0.1.5" }
zennode = { version = "0.1", default-features = false, features = ["derive"], optional = true }
zenpixels-convert = { version = ">=0.2.15, <0.4.0", features = ["hdr-experimental"] }
zenquant = { version = "0.1.2", default-features = false, optional = true }

[dev-dependencies]
imgref = "1.12"
palette = { version = "0.7", default-features = false, features = ["std"] }
rgb = { version = "0.8", default-features = false, features = ["as-bytes"] }
almost-enough = "0.4.4"
# 0.3.0 unpublished (crates.io tops out at 0.2.7); resolved by the workspace-root
# git patch, same shape as zencodecs' zensim dep. CI paths it to the sibling clone.
zensim = { version = "0.3.0", default-features = false }
zenpixels = { version = ">=0.2.10, <0.4.0", features = ["planar", "rgb"] }
zenpixels-convert = { version = ">=0.2.10, <0.4.0", features = ["planar"] }
# examples/compare_autotune.rs decodes the corpus and re-encodes JPEG through
# the dispatch layer. Dev-only, so this does not make zenfilters depend on
# zencodecs (and zencodecs does not depend on zenfilters, so there is no cycle).
zencodecs = { workspace = true, features = ["std", "jpeg", "png", "webp"] }

# Native-only: deps that don't compile for wasm32
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# zenraw disabled — core2 crate fully yanked, breaks rawler→libflate chain
# zenraw = { version = "0.1", features = ["rawler", "darktable", "exif", "apple"] }
zenbench = { version = "0.1.2", features = ["criterion-compat"] }
# DEV-only: lets benches/kernel_tiers.rs disable the baseline SIMD token (NEON
# on aarch64) so the "scalar" arm is real rather than a second measurement of
# the SIMD path. Feature unification applies this to test/bench builds only.
archmage = { version = "0.9.17", features = ["testable_dispatch"] }
libblur = { version = "0.23", default-features = true }
zenresize = { version = "0.2.1", default-features = false, features = ["std"] }
image = "0.25"
codec-corpus = "1.0.3"

[[example]]
name = "blur_bench"
required-features = ["experimental"]

[[example]]
name = "fused_bench"
required-features = ["experimental"]

[[example]]
name = "train_autotune"
required-features = ["experimental"]

[[example]]
name = "compare_autotune"
required-features = ["experimental"]

[[example]]
name = "darktable_parity"
required-features = ["experimental"]

[[example]]
name = "mobile_parity"
required-features = ["experimental"]

[[example]]
name = "perf_probe"
required-features = ["experimental"]

[[example]]
name = "warp_bench"
required-features = ["experimental"]

[[example]]
name = "film_look_gallery"
required-features = ["experimental"]

[[example]]
name = "filter_audit"
required-features = ["experimental"]

[[example]]
name = "whitebg_corpus"
required-features = ["experimental"]

[[example]]
name = "clipart_flatten_demo"
required-features = ["experimental"]

[[example]]
name = "white_diff"
required-features = ["experimental"]

[[test]]
name = "reference_validation"

[[test]]
name = "quality_validation"
required-features = ["local-fixtures"]

[[test]]
name = "imagemagick_comparison"
required-features = ["srgb-compat"]

[[bench]]
name = "row_batch"
harness = false
required-features = ["srgb-filters"]

[[bench]]
name = "color_grading"
harness = false

[package.metadata.superwork.ci]
strategy = "strip_path"
delete = ["zencodecs", "zenraw", "zenbench", "zennode"]
delete_sections = ["patch.crates-io"]


[[bench]]
name = "kernel_tiers"
harness = false
