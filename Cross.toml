# `cross` runs the i686 CI lane inside its own container image, which ships a
# Rust toolchain and a multilib gcc but none of the extra build-script tooling
# this workspace's dependency closure needs.
#
# zencodecs takes `turbojpeg 1.4` as a DEV-dependency, and dev-deps are compiled
# for every test target regardless of which cargo features are on — so even
# `cross test -p zencodecs --no-default-features` builds libjpeg-turbo from
# source through cmake with REQUIRE_SIMD=ON. Without an assembler that configure
# step dies before compiling anything:
#
#     CMake Error at simd/CMakeLists.txt:52 (enable_language):
#       No CMAKE_ASM_NASM_COMPILER could be found.
#
# (cmake itself is already in the image — the configure run got as far as the
# assembler probe.) The zen-workspace setup action installs nasm on Linux for
# exactly this reason, but the i686 lane deliberately does not use that action
# (see .github/workflows/ci.yml), and it would install onto the runner host
# rather than into this container anyway.
#
# Plain `nasm`, with no `$CROSS_DEB_ARCH` suffix: nasm is a host-architecture
# tool that happens to emit 32-bit objects, so the amd64 build of it is the one
# wanted here.
[target.i686-unknown-linux-gnu]
pre-build = [
    "apt-get update && apt-get install --assume-yes nasm",
]
