name: Fuzz

# A BUILD gate, not a fuzzing campaign. It compiles every fuzz target on every
# push so API drift fails CI the day it happens.
#
# Why it exists: this repo had no Fuzz workflow at all, so nothing ever
# compiled `fuzz/` or `zencodecs/fuzz/`. Both are standalone Cargo workspaces
# (`[workspace] members = ["."]`) excluded from the root, so neither
# `cargo check --all-targets` nor clippy at the repo root ever reaches them.
# They rotted silently: by 2026-08-29 the two sub-workspaces could not even
# resolve (4fd592d0, 6d43e25c) and eight targets no longer compiled against
# `Limits` (57f3c9f9 — E0063 for the added `max_output_bytes`, E0599 for
# `with_max_memory_bytes` → `with_max_memory`, E0308 for u64 → u32
# width/height). Every one of those is a plain type error a `cargo check`
# would have caught on the commit that introduced it.
#
# Why `cargo check` and not `cargo fuzz build`: `cargo fuzz` needs a nightly
# toolchain plus `-Zsanitizer=address`, and it fully codegens the whole codec
# dependency graph with sanitizer-coverage instrumentation — minutes of work
# per target, times eleven targets, for a gate whose entire job is to catch
# type drift. `cargo check` catches exactly the same class (every rot found on
# 2026-08-29 was E0063/E0308/E0599 or a resolution failure) on stable, in a
# fraction of the time. Actual fuzzing stays a hand-run/nightly activity —
# `zencodecs/fuzz/README.md` and the justfile document it.

on:
  push:
    branches: [main, master]
  pull_request:

# Superseded runs waste runner queue; only the newest commit per ref matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Linux only, deliberately: the fuzz targets are `#![no_main]` libFuzzer bins
  # that only ever run under `cargo fuzz` on x86-64 Linux. Compiling them on
  # Windows/macOS would gate nothing these targets can actually exercise.
  targets:
    name: Fuzz targets compile (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [fuzz, zencodecs/fuzz]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      # Both standalone manifests use exact git revisions and portable patch
      # tables. Compile those declarations verbatim; sibling overrides would
      # hide incompatible versions or replace the coordinated codec APIs.
      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-${{ matrix.workspace }}
          workspaces: ${{ matrix.workspace }}

      - name: cargo check --all-targets
        working-directory: ${{ matrix.workspace }}
        run: cargo check --locked --all-targets

  # The committed crash seeds under `zencodecs/fuzz/regression/` are minimized
  # inputs for bugs that have been fixed. Replaying them needs neither nightly
  # nor cargo-fuzz, so they gate on stable — see
  # `zencodecs/tests/fuzz_regression.rs`.
  #
  # No `|| true`-shaped fallback anywhere in this job: the harness asserts the
  # seed directory exists and is non-empty, so a moved or emptied corpus fails
  # loudly instead of turning into a gate that doesn't gate.
  regression:
    name: Fuzz regression seeds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: imazen/zen-workspace/.github/actions/setup@682b725a555350afefab5e0f936fbb7955d95a64
        with:
          cache: 'false'
          sibling-overrides: 'false'
      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-regression

      # A subset of the zencodecs feature line ci.yml already builds (that one
      # plus `raw-decode*`), so this adds a job but no new dependency graph.
      # The `raw-*` features are dropped on purpose: RAW decode routes
      # TIFF-magic input into rawler, which `zencodecs/fuzz/Cargo.toml`
      # documents as not panic-safe on untrusted input and deliberately
      # excludes from fuzzing. Everything the seeds actually need is here —
      # each committed seed is a JPEG XL codestream (`ff 0a`), so `jxl-decode`
      # is what carries them past format detection.
      - name: Replay committed crash seeds
        run: |
          cargo test -p zencodecs --no-default-features \
            --features std,cms,jpeg,jpeg-ultrahdr,webp,gif,gif-zenquant,png,png-zenquant,jxl-decode,bitmaps-bmp \
            --test fuzz_regression -- --nocapture
