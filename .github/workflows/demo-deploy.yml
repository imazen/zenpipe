name: Deploy Demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - 'src/**'
      - '.github/workflows/demo-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "demo-pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: demo/crate

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.117

      - uses: actions/checkout@v4
        with:
          repository: imazen/zen-workspace
          path: zen-workspace

      - name: Install cargo-superwork
        run: cargo install cargo-superwork --git https://github.com/imazen/cargo-superwork

      - name: Transform deps for CI
        run: |
          # ci-prep regenerates [patch.crates-io] with git entries for every
          # crate in Superwork.toml's patch_repos — including the zenjxl-decoder
          # trio. (An inline injection of those three entries used to live here
          # and produced a duplicate-key manifest once patch_repos gained them.)
          cargo superwork ci-prep --config zen-workspace/Superwork.toml
          rm -f Cargo.lock
          # demo/crate builds standalone (workspace-excluded), and cargo only
          # honors [patch.crates-io] from the build's OWN workspace root — the
          # regenerated patches in the repo-root manifest are invisible to it.
          # Replace demo/crate's committed dev-time path patches with the
          # generated full-ecosystem git section (no hardcoded crate list).
          python3 - <<'EOF'
          import re
          sec = re.compile(r'^\[patch\.crates-io\]\n(?:.*\n)*?(?=^\[|\Z)', re.M)
          root = open('Cargo.toml').read()
          m = sec.search(root)
          assert m, "ci-prep left no [patch.crates-io] in the root manifest"
          demo = sec.sub('', open('demo/crate/Cargo.toml').read()).rstrip('\n')
          open('demo/crate/Cargo.toml', 'w').write(demo + '\n\n' + m.group(0))
          print(f"mirrored {m.group(0).count(chr(10))} patch lines into demo/crate")
          EOF
          rm -f demo/crate/Cargo.lock

      - name: Build WASM (threaded, nightly)
        run: |
          cd demo/crate
          # One `-C link-arg=` per linker flag: with a single `-C link-args=`
          # only the first flag binds; the rest hit rustc bare
          # ("Unrecognized option: 'import-memory'").
          RUSTFLAGS="-C target-feature=+atomics,+bulk-memory,+mutable-globals,+simd128 -C link-arg=--shared-memory -C link-arg=--import-memory -C link-arg=--max-memory=1073741824 -C link-arg=--export=__wasm_init_tls -C link-arg=--export=__tls_size -C link-arg=--export=__tls_align -C link-arg=--export=__tls_base" \
            cargo +nightly build --target wasm32-unknown-unknown --release \
            --features "wasm,parallel" -Z build-std=panic_abort,std
          wasm-bindgen --target web --out-dir ../pkg \
            target/wasm32-unknown-unknown/release/zenpipe_demo.wasm

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp demo/index.html _site/
          cp demo/schema.json _site/
          cp demo/worker.js _site/
          cp demo/serve.py _site/
          cp demo/coi-serviceworker.js _site/
          cp -r demo/js _site/js
          cp -r demo/pkg _site/pkg

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Also deploy to Vercel (with COOP/COEP headers for SharedArrayBuffer)
      - name: Deploy to Vercel
        if: env.VERCEL_TOKEN != ''
        run: |
          npm i -g vercel
          cd _site
          cp ../demo/vercel.json .
          vercel deploy --prod --token=$VERCEL_TOKEN --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
