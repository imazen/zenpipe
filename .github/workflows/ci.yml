name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Superseded runs only waste runner queue — particularly the macOS
# jobs, which wait on GitHub's scarcest pool. Only the newest
# commit's run matters per ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    uses: imazen/zen-workspace/.github/workflows/rust-ci.yml@main
    with:
      # macOS Intel is a mandatory lane (x86_64 macOS is the only place several
      # of the SIMD tiers and the Apple linker are exercised together), and
      # `macos-latest` is aarch64-only, so it has to be named explicitly. The
      # reusable workflow dropped macOS from its DEFAULT list to cut Actions
      # spend and documents `platforms` as the opt-back-in; this is that opt-in.
      # `macos-26-intel` rather than `macos-15-intel` because zenpipe ships no
      # binaries — nothing here needs the older SDK's deployment target.
      # Everything else is the reusable workflow's default list, repeated
      # verbatim because `platforms` replaces it wholesale rather than adding.
      platforms: '["ubuntu-latest", "ubuntu-24.04-arm", "windows-latest", "windows-11-arm", "macos-26-intel"]'
      # Ordering note: the reusable workflow runs these under `bash -e` (one
      # failing `$cmd` aborts every line after it in the same step — see
      # imazen/zen-workspace's rust-ci.yml), so put per-package checks that
      # don't share a failure mode BEFORE the zenfilters run. zenfilters'
      # quality_validation.rs (vips/darktable zensim-threshold comparisons on
      # the CID22 corpus) is NOT built here: it requires the `local-fixtures`
      # feature and runs via `just test-zenfilters-quality` on a workstation
      # (zenpipe#44) — it used to self-skip on CI and pass without testing.
      clippy_extra_runs: |
        cargo clippy --all-targets --no-default-features -- -D warnings
        cargo clippy -p zenlayout --all-targets -- -D warnings
        cargo clippy -p zencodecs --no-default-features --all-targets -- -D warnings
        cargo clippy -p zeneditor --all-targets -- -D warnings
        cargo clippy -p zenfilters --all-targets -- -D warnings
      test_extra_runs: |
        cargo test --all-targets --no-default-features
        cargo test --features zennode
        cargo test --features zennode,json-schema
        cargo test -p zenlayout --all-targets
        cargo test -p zencodecs --no-default-features --all-targets
        cargo test -p zeneditor --all-targets
        cargo test -p zencodecs --no-default-features --features std,cms,jpeg,jpeg-ultrahdr,webp,gif,gif-zenquant,png,png-zenquant,jxl-decode,bitmaps-bmp,raw-decode,raw-decode-exif,raw-decode-xmp,raw-decode-gainmap --all-targets
        cargo test -p zenfilters --all-targets

  # Public-API surface snapshots (docs/public-api/) — the CI-free `apidoc/`
  # runner package (see its Cargo.toml), so this is the only job that ever
  # compiles zenutils-apidoc's dependency tree or invokes rustdoc. Standalone
  # (not routed through the reusable rust-ci.yml `test_extra_runs`) because it
  # needs a nightly toolchain for rustdoc JSON, distinct from every other job's
  # stable toolchain (zenpipe#bug-19: this gate was previously absent, so a
  # stale committed snapshot — depthmap/exif removed 2026-06-25, Limits
  # aliased to zencodec::ResourceLimits — never got caught).
  api-doc:
    name: Public API snapshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly # rustdoc JSON for public-api
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check committed API snapshots are current
        run: cargo test --manifest-path apidoc/Cargo.toml
        env:
          ZEN_API_DOC: check

  # 32-bit coverage. i686 is a primary target: it is where `usize` narrowing
  # bugs show up (stride/offset arithmetic that silently fits in 64 bits, byte
  # counts multiplied before a bounds check) and it is the closest proxy CI has
  # for wasm32 pointer width, which the demo actually ships on.
  #
  # Deliberately NOT routed through zen-workspace's setup action: that action
  # runs `ci-clone --add-paths`, which rewrites every internal dep to a sibling
  # checkout ABOVE the repo directory. `cross` only bind-mounts the project
  # directory into its container, so those paths would be missing inside it and
  # every job would fail at manifest load. A plain checkout resolves the same
  # graph through the repo's own git-form [patch.crates-io] — which is exactly
  # the bare-clone route those entries exist for (see the root Cargo.toml) — and
  # needs nothing outside the project dir. The one path patch that remains
  # (`zenlayout`) is in-repo, so it mounts fine.
  #
  # `--no-default-features` keeps the graph to the pure-Rust core (default
  # pulls zenfilters + moxcms); the per-package runs below add the two crates
  # whose arithmetic is most pointer-width-sensitive.
  i686:
    name: Test (i686 cross)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - uses: Swatinem/rust-cache@v2
        with:
          key: cross-i686
      - name: Test zenpipe (no default features)
        run: cross test --target i686-unknown-linux-gnu --no-default-features
      - name: Test zenlayout
        run: cross test -p zenlayout --target i686-unknown-linux-gnu --all-targets
      - name: Test zencodecs (no default features)
        run: cross test -p zencodecs --target i686-unknown-linux-gnu --no-default-features
