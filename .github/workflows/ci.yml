name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # Public-API snapshot freshness gate (docs/public-api/, tests/public_api_doc.rs).
  # The reusable rust-ci.yml below has no env passthrough, so its matrix jobs
  # skip the snapshot test (ZEN_API_DOC unset under GITHUB_ACTIONS == off);
  # this job runs the =check gate with nightly rustdoc + cargo-public-api.
  api-doc:
    name: Public-API snapshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: imazen/zen-workspace/.github/actions/setup@main
      - uses: dtolnay/rust-toolchain@nightly # rustdoc JSON for cargo-public-api
      - uses: dtolnay/rust-toolchain@stable # restore stable as default
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-public-api
      - name: Public-API snapshots are current
        run: cargo test -p zenpipe --test public_api_doc
        env:
          ZEN_API_DOC: check

  rust:
    uses: imazen/zen-workspace/.github/workflows/rust-ci.yml@main
    with:
      clippy_extra_runs: |
        cargo clippy --all-targets --no-default-features -- -D warnings
        cargo clippy -p zenfilters --all-targets -- -D warnings
        cargo clippy -p zenlayout --all-targets -- -D warnings
        cargo clippy -p zencodecs --no-default-features --all-targets -- -D warnings
      test_extra_runs: |
        cargo test --all-targets --no-default-features
        cargo test --features zennode
        cargo test --features zennode,json-schema
        cargo test -p zenfilters --all-targets
        cargo test -p zenlayout --all-targets
        cargo test -p zencodecs --no-default-features --all-targets
