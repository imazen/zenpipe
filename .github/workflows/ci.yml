name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Superseded runs only waste runner queue — particularly the macOS
# jobs, which wait on GitHub's scarcest pool. Only the newest
# commit's run matters per ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  locked-graph:
    name: Committed dependency graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Cargo loads this optional path dependency's manifest even when the
      # tuner feature is disabled. No source overrides or superwork setup:
      # this job must exercise the committed lock and git revision pins.
      - uses: actions/checkout@v7
        with:
          repository: imazen/zenavif
          ref: 3be52e05d7bba4ca615bee0a065985d609766be3
          path: _ci/zenavif
          persist-credentials: false
      - run: mv _ci/zenavif ../zenavif
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: committed-graph
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq nasm
      - run: python3 scripts/check-streaming-pins.py --self-test
      - run: python3 scripts/check-streaming-pins.py
      - name: Locked tests and strict lint
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked -p zencodecs --features cms --test color_adapt
          cargo test --locked -p zencodecs --features jxl-encode,tiff,bitmaps-qoi,bitmaps-tga,bitmaps-hdr --test streamed_bytes
          cargo test --locked -p zencodecs --test explicit_jpeg_config
          cargo test --locked -p zencodecs --test animation_streamed_bytes
          cargo test --locked -p zencodecs --test strided_encode
          cargo check --locked --manifest-path fuzz/Cargo.toml
          cargo check --locked --manifest-path zencodecs/fuzz/Cargo.toml
      - name: Standalone WASM packages
        run: |
          cargo check --locked --manifest-path demo/crate/Cargo.toml --target wasm32-unknown-unknown
          cargo check --locked --manifest-path wasm-size-shim/Cargo.toml --target wasm32-unknown-unknown --lib

  rust:
    uses: imazen/zen-workspace/.github/workflows/rust-ci.yml@main
    with:
      # macOS runs on ARM64 only (`macos-latest`); Intel macOS lanes are not
      # run. The reusable workflow's default list has no macOS, so it is named
      # here. `platforms` replaces the default list wholesale, so the other
      # entries repeat it verbatim.
      platforms: '["ubuntu-latest", "ubuntu-24.04-arm", "windows-latest", "windows-11-arm", "macos-latest"]'
      # Ordering note: the reusable workflow runs these under `bash -e` (one
      # failing `$cmd` aborts every line after it in the same step — see
      # imazen/zen-workspace's rust-ci.yml), so put per-package checks that
      # don't share a failure mode BEFORE the zenfilters run. zenfilters'
      # quality_validation.rs (vips/darktable zensim-threshold comparisons on
      # the CID22 corpus) is NOT built here: it requires the `local-fixtures`
      # feature and runs via `just test-zenfilters-quality` on a workstation
      # (zenpipe#44) — it used to self-skip on CI and pass without testing.
      clippy_extra_runs: |
        cargo clippy --all-targets --no-default-features -- -D warnings
        cargo clippy -p zenlayout --all-targets -- -D warnings
        cargo clippy -p zencodecs --no-default-features --all-targets -- -D warnings
        cargo clippy -p zeneditor --all-targets -- -D warnings
        cargo clippy -p zenfilters --all-targets -- -D warnings
      # operation_matrix leaves out `tiff` (zentiff on zenextras main uses
      # image-tiff's `encoder::DeflateLevel`, which the fork's main no longer
      # has) and `avif-svt`/`avif-aom` (zenavif main does not build against
      # the current zenav1-svt/zenav1-aom mains until zenavif#48/#49 land).
      test_extra_runs: |
        cargo test -p zencodecs --no-default-features --features std,cms,jpeg,png,webp,gif-zenquant,bitmaps-bmp,bitmaps-qoi,bitmaps-tga,bitmaps-hdr,jxl-encode,jxl-decode,avif-encode,avif-decode --test operation_matrix
        cargo test --all-targets --no-default-features
        cargo test --features zennode
        cargo test --features zennode,json-schema
        cargo test -p zenlayout --all-targets
        cargo test -p zencodecs --no-default-features --all-targets
        cargo test -p zencodecs --no-default-features --features std,pdf-decode --lib pdf_
        cargo test -p zeneditor --all-targets
        cargo test -p zencodecs --no-default-features --features metadata,jpeg-ultrahdr,jxl-encode,jxl-decode,png --test metadata_scrub
        cargo test --manifest-path tools/metadata-services/Cargo.toml
        cargo test -p zencodecs --no-default-features --features inventory,jpeg,png,webp,gif,avif-encode,avif-decode,jxl-encode,jxl-decode --lib inventory::tests
        cargo test -p zencodecs --no-default-features --features std,inventory,pdf-decode --test pdf pdf_inventory_dispatches_to_zenpdf
        cargo test -p zencodecs --no-default-features --features std,cms,jpeg,jpeg-ultrahdr,webp,gif,gif-zenquant,png,png-zenquant,jxl-decode,bitmaps-bmp,raw-decode,raw-decode-exif,raw-decode-xmp,raw-decode-gainmap,tonemap --all-targets
        cargo test -p zenfilters --all-targets
        cargo test --release -p zencodecs --features jxl-encode,bitmaps-qoi,bitmaps-tga,bitmaps-hdr --test transcode_matrix

  # Public-API surface snapshots (docs/public-api/) — the CI-free `apidoc/`
  # runner package (see its Cargo.toml), so this is the only job that ever
  # compiles zenutils-apidoc's dependency tree or invokes rustdoc. Standalone
  # (not routed through the reusable rust-ci.yml `test_extra_runs`) because it
  # needs a nightly toolchain for rustdoc JSON, distinct from every other job's
  # stable toolchain (zenpipe#bug-19: this gate was previously absent, so a
  # stale committed snapshot — depthmap/exif removed 2026-06-25, Limits
  # aliased to zencodec::ResourceLimits — never got caught).
  # Fails if the AVIF-decoder git deps float, disagree across this repo's
  # several manifests and lockfiles, or sit dead as an unused `[patch]`.
  # No toolchain and no cargo: it reads the committed manifests and lockfiles,
  # so it costs seconds and cannot be skipped by a cache hit. It has to be its
  # own job rather than a step in `rust` because that one is routed through the
  # reusable rust-ci.yml.
  #
  # Why it exists: a git dep with no `rev` re-resolves to whatever the branch
  # points at, with no edit to any manifest and nothing recording that it moved.
  # This repo held three different zenavif revs across its lockfiles at once
  # (root 11033c95, fuzz/ 7d950f1c, demo/crate/ fallen back to the registry at
  # 0.1.6), and no CI job here enables `avif-decode`, so nothing else notices.
  decoder-pins:
    name: Decoder pin agreement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Self-test the check (it must fail on each defect)
        run: python3 scripts/check-decoder-pins.py --self-test
      - name: Check every manifest and lockfile agrees
        run: python3 scripts/check-decoder-pins.py

  api-doc:
    name: Public API snapshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly # rustdoc JSON for public-api
      - uses: dtolnay/rust-toolchain@stable
      - uses: imazen/zen-workspace/.github/actions/setup@main
        with:
          cache: 'false'
      - uses: Swatinem/rust-cache@v2

      - name: Check committed API snapshots are current
        run: cargo test --manifest-path apidoc/Cargo.toml
        env:
          ZEN_API_DOC: check

  # 32-bit coverage. i686 is a primary target: it is where `usize` narrowing
  # bugs show up (stride/offset arithmetic that silently fits in 64 bits, byte
  # counts multiplied before a bounds check) and it is the closest proxy CI has
  # for wasm32 pointer width, which the demo actually ships on.
  #
  # Resolve the optional tuner and its sibling manifests before Cargo loads
  # the workspace. Mount the sibling directory for cross too: even disabled
  # path dependencies must have readable manifests inside the container.
  # `--no-default-features` keeps the graph to the pure-Rust core (default
  # pulls zenfilters + moxcms); the per-package runs below add the two crates
  # whose arithmetic is most pointer-width-sensitive.
  i686:
    name: Test (i686 cross)
    runs-on: ubuntu-latest
    env:
      CROSS_CONTAINER_OPTS: -v ${{ github.workspace }}/..:${{ github.workspace }}/..
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu
      - uses: imazen/zen-workspace/.github/actions/setup@main
        with:
          cache: 'false'
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - uses: Swatinem/rust-cache@v2
        with:
          key: cross-i686
      - name: Test zenpipe (no default features)
        run: cross test --target i686-unknown-linux-gnu --no-default-features
      - name: Test zenlayout
        run: cross test -p zenlayout --target i686-unknown-linux-gnu --all-targets
      - name: Test zencodecs (no default features)
        run: cross test -p zencodecs --target i686-unknown-linux-gnu --no-default-features

      - name: Test codec operation routes on i686
        run: cross test -p zencodecs --target i686-unknown-linux-gnu --no-default-features --features std,cms,jpeg,png,webp,gif-zenquant,bitmaps-bmp,bitmaps-qoi,bitmaps-tga,bitmaps-hdr,jxl-encode,jxl-decode,avif-encode,avif-decode --test operation_matrix

  operation-oracles:
    name: Codec operation matrix with independent readers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: imazen/zen-workspace/.github/actions/setup@main
        with:
          cache: 'false'
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: sudo apt-get update && sudo apt-get install -y imagemagick libjxl-tools
      - name: Inventory enabled and disabled, with explicit oracle executables
        env:
          ZEN_CODEC_MATRIX_MAGICK: convert
          ZEN_CODEC_MATRIX_DJXL: djxl
          # Ubuntu's ImageMagick 6 has no farbfeld or QOI delegate; those
          # formats are reported UNEXECUTED rather than read by it.
          ZEN_CODEC_MATRIX_ORACLE_FORMATS: jpeg,png,webp,gif,avif,jxl,pnm,bmp,tga,tiff,hdr
        run: |
          just codec-operation-matrix
          just codec-operation-matrix-inventory
