[package]
name = "wasm-size-shim"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[[bin]]
name = "wasm-demo"
path = "src/main.rs"

[[bin]]
name = "native-bench"
path = "src/native_bench.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
zenpipe = { path = "..", features = ["std"] }
# zenresize/zenblend must match zenpipe's own registry deps exactly —
# a path copy here creates a second crate instance and NodeOp field
# types (Filter, BlendMode) stop unifying.
zenresize = { version = "0.3.1", default-features = false, features = ["std"] }
zenlayout = { path = "../zenlayout" }
zenblend = { version = "0.1.2", default-features = false }
zenfilters = { path = "../zenfilters" }
zencodec = { version = "0.1.26" }
zenpixels = { path = "../../zenpixels/zenpixels" }
hashbrown = "0.16"
rgb = "0.8"
bytemuck = { version = "1", features = ["derive"] }
imgref = "1"

# Codecs
# zenjpeg 0.9.0 dropped the no-op `trellis` feature (trellis is always compiled now).
zenjpeg = { path = "../../zenjpeg/zenjpeg", default-features = false, features = ["zencodec"] }
# zengif main made `zencodec` a required dep (no longer a feature; imazen/zengif#13).
zengif = { path = "../../zengif", default-features = false, features = ["std", "quantizr"] }
zenpng = { path = "../../zenpng" }
# zenwebp main made `zencodec` a required dep (no longer a feature; zenwebp#69).
zenwebp = { path = "../../zenwebp" }
# zenavif: rav1d API change (lossless/base_q_idx fields removed from AV1Metadata)
# zenavif = { path = "../../zenavif", features = ["zencodec"] }
# zenjxl: API mismatch with published zencodec (parse_iso21496_jpeg renamed)
# zenjxl = { path = "../../zenjxl", features = ["encode", "decode", "zencodec"] }
# zentiff: build error with tiff crate version mismatch (color_map, DeflateLevel)
# zenbitmaps: included if zentiff compiles
# zentiff = { path = "../../zentiff", features = ["zencodec"] }
# zenbitmaps = { path = "../../zenbitmaps", features = ["zencodec"] }


[patch.crates-io]
# zenjpeg is a direct path dep above, so its own workspace-root
# [patch.crates-io] (where `zenanalyze 0.2.0` resolves) never applies here, and
# the registry is frozen at 0.1.0. Without this a fresh resolve fails with
# "failed to select a version for the requirement `zenanalyze = ^0.2.0`".
zenanalyze = { path = "../../zenanalyze" }
zennode = { path = "../../zennode/zennode" }
zennode-derive = { path = "../../zennode/zennode-derive" }
zenpixels = { path = "../../zenpixels/zenpixels" }
zencodec = { path = "../../zencodec" }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
strip = true

[profile.release-names]
inherits = "release"
strip = false
