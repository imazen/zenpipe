zenbitmaps = { git = "https://github.com/imazen/zenbitmaps", rev = "fa16691e485ecf7dbd6cdbd93810afebbad89c9a" }
zengif = { git = "https://github.com/imazen/zengif", rev = "469a893fcbce40d96b8602560390e79891bc5d3d" }
zenavif = { git = "https://github.com/imazen/zenavif", rev = "f29fd4d1ea0ad928164ca9a7dac9306fa7dcc305" }
zenraw = { git = "https://github.com/imazen/zenraw", rev = "a6b78e93c46e32df4eb1bc9066f494a036b36031" }
zenpdf = { git = "https://github.com/imazen/zenextras", rev = "f3b191a74fc08be3f611ade89bd5b9c22f34d2b5" }

[patch."https://github.com/imazen/zenlayout.git"]
zenlayout = { path = "../zenlayout" }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
strip = true

[profile.release-names]
inherits = "release"
strip = false
