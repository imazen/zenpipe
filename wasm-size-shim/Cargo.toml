[package]
name = "wasm-size-shim"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[[bin]]
name = "wasm-demo"
path = "src/main.rs"

[[bin]]
name = "native-bench"
path = "src/native_bench.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
zenpipe = { path = "..", features = ["std"] }
# zenresize/zenblend must match zenpipe's own registry deps exactly —
# a path copy here creates a second crate instance and NodeOp field
# types (Filter, BlendMode) stop unifying.
zenresize = { version = "0.3.1", default-features = false, features = ["std"] }
zenlayout = { path = "../zenlayout" }
zenblend = { version = "0.1.2", default-features = false }
zenfilters = { path = "../zenfilters" }
zencodec = { version = ">=0.3.0, <0.4.0" }
zenpixels = { version = ">=0.5.0, <0.6.0" }
hashbrown = "0.16"
rgb = "0.8"
bytemuck = { version = "1", features = ["derive"] }
imgref = "1"

# Codecs
# zenjpeg 0.9.0 dropped the no-op `trellis` feature (trellis is always compiled now).
zenjpeg = { version = "0.9.0", default-features = false, features = ["zencodec"] }
# zengif main made `zencodec` a required dep (no longer a feature; imazen/zengif#13).
zengif = { version = "0.8.0", default-features = false, features = ["std", "quantizr"] }
zenpng = { version = "0.2.0" }
# zenwebp main made `zencodec` a required dep (no longer a feature; zenwebp#69).
zenwebp = { version = "0.5.0" }
# zenavif: rav1d API change (lossless/base_q_idx fields removed from AV1Metadata)
# zenavif = { path = "../../zenavif", features = ["zencodec"] }
# zenjxl: API mismatch with published zencodec (parse_iso21496_jpeg renamed)
# zenjxl = { path = "../../zenjxl", features = ["encode", "decode", "zencodec"] }
# zentiff: build error with tiff crate version mismatch (color_map, DeflateLevel)
# zenbitmaps: included if zentiff compiles
# zentiff = { path = "../../zentiff", features = ["zencodec"] }
# zenbitmaps = { path = "../../zenbitmaps", features = ["zencodec"] }


[patch.crates-io]
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "7fa068834f8074c2630a352b25f355f7c90751f8" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "7fa068834f8074c2630a352b25f355f7c90751f8" }
garb = { git = "https://github.com/imazen/garb", rev = "457ff8b9153e9d675a39dc098052b2ffeb6206fa" }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "ae83f19426737635fee3dd16f228681019f52585" }
zencodec = { git = "https://github.com/imazen/zencodec", rev = "5d4f6c473404c09c95f404543f8a16a1e3cb8477" }
zencodec-testkit = { git = "https://github.com/imazen/zencodec", rev = "5d4f6c473404c09c95f404543f8a16a1e3cb8477" }
zencodec-io = { git = "https://github.com/imazen/zencodec", rev = "5d4f6c473404c09c95f404543f8a16a1e3cb8477" }
zencodec-coroutine = { git = "https://github.com/imazen/zencodec", rev = "5d4f6c473404c09c95f404543f8a16a1e3cb8477" }
zenmeta = { git = "https://github.com/imazen/zencodec", rev = "5d4f6c473404c09c95f404543f8a16a1e3cb8477" }
zenresize = { git = "https://github.com/imazen/zenresize", rev = "e6c077561dcb426b23d8e7c3da1ca0e12cc13c5f" }
zenflate = { git = "https://github.com/imazen/zenflate", rev = "7270e38faca9cdbae793938fa229d40ac4fe4c39" }
tiff = { git = "https://github.com/lilith/image-tiff", rev = "10a3b6b2fa88eb5943525066a989ea9e64e644d5" }
hayro-syntax = { git = "https://github.com/lilith/hayro", rev = "2ce50d0164878b8505e118f81dcb1d0367b26957" }
zenjpeg = { git = "https://github.com/imazen/zenjpeg", rev = "80dac328d0b9279413d037c0291477c8df6ae53b" }
