[package]
name = "wasm-size-shim"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[[bin]]
name = "wasm-demo"
path = "src/main.rs"

[[bin]]
name = "native-bench"
path = "src/native_bench.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
zenpipe = { path = "..", features = ["std"] }
# zenresize/zenblend must match zenpipe's own registry deps exactly —
# a path copy here creates a second crate instance and NodeOp field
# types (Filter, BlendMode) stop unifying.
zenresize = { version = "0.3.1", default-features = false, features = ["std"] }
zenlayout = { path = "../zenlayout" }
zenblend = { version = "0.1.2", default-features = false }
zenfilters = { path = "../zenfilters" }
zencodec = { version = ">=0.1.26, <0.3.0" }
zenpixels = { path = "../../zenpixels/zenpixels" }
hashbrown = "0.16"
rgb = "0.8"
bytemuck = { version = "1", features = ["derive"] }
imgref = "1"

# Codecs
# zenjpeg 0.9.0 dropped the no-op `trellis` feature (trellis is always compiled now).
zenjpeg = { path = "../../zenjpeg/zenjpeg", default-features = false, features = ["zencodec"] }
# zengif main made `zencodec` a required dep (no longer a feature; imazen/zengif#13).
zengif = { path = "../../zengif", default-features = false, features = ["std", "quantizr"] }
zenpng = { path = "../../zenpng" }
# zenwebp main made `zencodec` a required dep (no longer a feature; zenwebp#69).
zenwebp = { path = "../../zenwebp" }
# zenavif: rav1d API change (lossless/base_q_idx fields removed from AV1Metadata)
# zenavif = { path = "../../zenavif", features = ["zencodec"] }
# zenjxl: API mismatch with published zencodec (parse_iso21496_jpeg renamed)
# zenjxl = { path = "../../zenjxl", features = ["encode", "decode", "zencodec"] }
# zentiff: build error with tiff crate version mismatch (color_map, DeflateLevel)
# zenbitmaps: included if zentiff compiles
# zentiff = { path = "../../zentiff", features = ["zencodec"] }
# zenbitmaps = { path = "../../zenbitmaps", features = ["zencodec"] }


[patch.crates-io]
# `zenpipe = { path = ".." }` drags zenpipe's whole OPTIONAL dep set into
# resolution (cargo resolves optional deps whether or not their feature is on),
# and most of those crates' current versions are unpublished. So every one of
# them needs an entry here or a fresh resolve dies at the first unmet registry
# requirement — which is what took the WASM Benchmark workflow red on
# 2026-08-27 ("failed to select a version for the requirement
# `zenjpeg = ^0.9.0`", registry tops out at 0.8.4).
#
# Form matters. For a crate this manifest ALSO path-deps directly (zenjpeg,
# zengif, zenpng, zenwebp above), the entry must be the SAME path, or the graph
# ends up with two instances of it and the shared zencodec types stop unifying.
# For everything else, git — the wasm-bench workflow clones a fixed list of
# siblings and a git source needs no clone at all.
zenjpeg = { path = "../../zenjpeg/zenjpeg" }
zengif = { path = "../../zengif" }
zenpng = { path = "../../zenpng" }
zenwebp = { path = "../../zenwebp" }
# zenjpeg is a direct path dep above, so its own workspace-root
# [patch.crates-io] (where `zenanalyze 0.2.0` resolves) never applies here, and
# the registry is frozen at 0.1.0. Without this a fresh resolve fails with
# "failed to select a version for the requirement `zenanalyze = ^0.2.0`".
# Git, not path: zenanalyze is not in the wasm-bench clone list, and it is not
# a direct dep here, so there is no instance to unify with.
zenanalyze = { git = "https://github.com/imazen/zenanalyze" }
# Reached through zenjpeg (gain-map/UltraHDR types). Rev-pinned to 0.5.0 for
# the same reason the repo-root table pins it: ultrahdr main is 0.6.0, and a
# floating patch would stop satisfying the `^0.5` requirement on this edge.
ultrahdr-core = { git = "https://github.com/imazen/ultrahdr", rev = "031d4a2070a522f82bd02aee712a2806a2c17bbd" }
# zenpixels' sibling crate; registry 0.2.10 predates the zenpixels main that
# `zenpixels = { path = ... }` below resolves to, so it has to move with it.
# Path, matching that entry: a git source here pulls zenpixels through its own
# internal dep and the graph ends up with two zenpixels, at which point
# `PixelDescriptor` / `PixelSlice` stop unifying across zencodecs (E0308).
zenpixels-convert = { path = "../../zenpixels/zenpixels-convert" }
zennode = { path = "../../zennode/zennode" }
zennode-derive = { path = "../../zennode/zennode-derive" }
zenpixels = { path = "../../zenpixels/zenpixels" }
zencodec = { path = "../../zencodec" }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
strip = true

[profile.release-names]
inherits = "release"
strip = false
