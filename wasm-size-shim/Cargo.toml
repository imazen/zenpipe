[package]
name = "wasm-size-shim"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[[bin]]
name = "wasm-demo"
path = "src/main.rs"

[[bin]]
name = "native-bench"
path = "src/native_bench.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
zenpipe = { path = "..", features = ["std"] }
# zenresize/zenblend must match zenpipe's own registry deps exactly —
# a path copy here creates a second crate instance and NodeOp field
# types (Filter, BlendMode) stop unifying.
zenresize = { version = "0.3.1", default-features = false, features = ["std"] }
zenlayout = { path = "../zenlayout" }
zenblend = { version = "0.1.2", default-features = false }
zenfilters = { path = "../zenfilters" }
zencodec = { version = ">=0.1.27, <0.3.0" }
zenpixels = { version = "0.2.17" }
hashbrown = "0.16"
rgb = "0.8"
bytemuck = { version = "1", features = ["derive"] }
imgref = "1"

# Codecs
# zenjpeg 0.9.0 dropped the no-op `trellis` feature (trellis is always compiled now).
zenjpeg = { version = "0.9.0", default-features = false, features = ["zencodec"] }
# zengif main made `zencodec` a required dep (no longer a feature; imazen/zengif#13).
zengif = { version = "0.8.0", default-features = false, features = ["std", "quantizr"] }
zenpng = { version = "0.2.0" }
# zenwebp main made `zencodec` a required dep (no longer a feature; zenwebp#69).
zenwebp = { version = "0.5.0" }
# zenavif: rav1d API change (lossless/base_q_idx fields removed from AV1Metadata)
# zenavif = { path = "../../zenavif", features = ["zencodec"] }
# zenjxl: API mismatch with published zencodec (parse_iso21496_jpeg renamed)
# zenjxl = { path = "../../zenjxl", features = ["encode", "decode", "zencodec"] }
# zentiff: build error with tiff crate version mismatch (color_map, DeflateLevel)
# zenbitmaps: included if zentiff compiles
# zentiff = { path = "../../zentiff", features = ["zencodec"] }
# zenbitmaps = { path = "../../zenbitmaps", features = ["zencodec"] }


[patch.crates-io]
# Share the production graph without external sibling source overrides.
zencodec = { git = "https://github.com/imazen/zencodec", rev = "d327434b0826a3e39633665c76f5081c0ceb34cc" }
zenjpeg = { git = "https://github.com/imazen/zenjpeg", rev = "4196fa93d422bc367d1e3ddadbaddfe672b9cdfc" }
heic = { git = "https://github.com/imazen/heic", rev = "8d40c94e018082f4bffcfc688dfbb8e83925a1b0" }
zentiff = { git = "https://github.com/imazen/zenextras", rev = "f3b191a74fc08be3f611ade89bd5b9c22f34d2b5" }
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "1d3ddd2131b22e9e3754c765d4ce45ce3901de59" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "1d3ddd2131b22e9e3754c765d4ce45ce3901de59" }
ultrahdr-core = { git = "https://github.com/imazen/ultrahdr", rev = "a834b2ccedc2b99b1fec3200365f00127a6baea6" }
zenjxl = { git = "https://github.com/imazen/zenjxl", rev = "9226d3a32cfd82f6c079f2921a8237f4ae05ee24" }
jxl-encoder = { git = "https://github.com/imazen/jxl-encoder", rev = "cd9a7325f97f5e178863d867c81b694cd8b169aa" }
zenjxl-decoder = { git = "https://github.com/imazen/zenjxl-decoder", rev = "f1faec70e41b0c1f31e9db3d2142071bf02d08d5" }
zenwebp = { git = "https://github.com/imazen/zenwebp", rev = "b5f28c976a0b285ec56ddc9301d5e1ed10a8e99f" }
zenpng = { git = "https://github.com/imazen/zenpng", rev = "fb0553964406c010901d6c95b3a34b8b3529b0f1" }
zennode = { git = "https://github.com/imazen/zennode", rev = "3ed1181c28829595170dcaaa1f4d57dc016a43b8" }
zennode-derive = { git = "https://github.com/imazen/zennode", rev = "3ed1181c28829595170dcaaa1f4d57dc016a43b8" }
zensim = { git = "https://github.com/imazen/zensimx", rev = "f2c86dcb8d35d1563abf84f78cbcb3be6ebd32d2" }
zensim-regress = { git = "https://github.com/imazen/zensimx", rev = "f2c86dcb8d35d1563abf84f78cbcb3be6ebd32d2" }
zenanalyze-api = { git = "https://github.com/imazen/zenanalyze", rev = "f7fe3435169716579670944d1b2cf1e0132c69db" }
zenanalyze = { git = "https://github.com/imazen/zenanalyze", rev = "f7fe3435169716579670944d1b2cf1e0132c69db" }
