[package]
name = "zenpipe-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Standalone workspace — excluded from parent to avoid LTO conflicts
# with ASAN sanitizer coverage instrumentation.
[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
zenpipe = { path = "..", features = ["job", "nodes-jpeg", "nodes-png", "nodes-webp", "nodes-gif"] }
zencodecs = { path = "../zencodecs", default-features = false }

# Replicate the parent workspace's [patch.crates-io] so transitive deps
# resolve identically to the root build (keep in sync with ../Cargo.toml).
[patch.crates-io]
zenjpeg = { git = "https://github.com/imazen/zenjpeg" }
# zenjpeg main resolves `zenanalyze 0.2.0` through a patch at its OWN workspace
# root, which is invisible from here; the registry is frozen at 0.1.0. Without
# this entry a fresh resolve of this workspace fails outright. See the repo-root
# manifest for the full rationale.
zenanalyze = { git = "https://github.com/imazen/zenanalyze" }
zenjxl = { git = "https://github.com/imazen/zenjxl" }
jxl-encoder = { git = "https://github.com/imazen/jxl-encoder" }
zenjxl-decoder = { git = "https://github.com/imazen/zenjxl-decoder" }
zenwebp = { git = "https://github.com/imazen/zenwebp" }
zenpng = { git = "https://github.com/imazen/zenpng" }
zennode = { git = "https://github.com/imazen/zennode" }
zennode-derive = { git = "https://github.com/imazen/zennode" }
zensim = { git = "https://github.com/imazen/zensim" }
zensim-regress = { git = "https://github.com/imazen/zensim" }
imageflow_types = { git = "https://github.com/imazen/imageflow" }
imageflow_riapi = { git = "https://github.com/imazen/imageflow" }
zensally = { git = "https://github.com/imazen/zensally" }
zensally-zentract = { git = "https://github.com/imazen/zensally" }

# Override zenresize's git dep on zenlayout to use the workspace copy
# (mirrors the root manifest's source-replacement patch).
[patch."https://github.com/imazen/zenlayout.git"]
zenlayout = { path = "../zenlayout" }

[[bin]]
name = "fuzz_job_decode"
path = "fuzz_targets/fuzz_job_decode.rs"
doc = false

[[bin]]
name = "fuzz_job_transcode"
path = "fuzz_targets/fuzz_job_transcode.rs"
doc = false
