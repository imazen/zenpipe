[package]
name = "zenpipe-demo"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["wasm"]
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:web-sys"]
parallel = ["dep:rayon", "dep:wasm-bindgen-rayon"]

[dependencies]
# Platform-agnostic editor model + controller (handles decode, encode, rendering)
zeneditor = { path = "../../zeneditor" }

# Codec types for format detection in WASM glue
zencodec = { version = ">=0.1.26, <0.3.0", default-features = false }

serde_json = "1"

# Multithreaded WASM via rayon (optional — requires SharedArrayBuffer + COOP/COEP)
rayon = { version = "1.10", optional = true }
wasm-bindgen-rayon = { version = "1.3", features = ["no-bundler"], optional = true }

# WASM-specific deps (optional for native testing)
# Pinned exactly: the Pages workflow installs wasm-bindgen-cli at this same
# version, and the bindgen schema requires crate == CLI. Bump both together.
wasm-bindgen = { version = "=0.2.123", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", features = ["ImageData"], optional = true }

# Mirror of the workspace root's git-form patch table (zenpipe#37) so
# the standalone demo resolves without sibling checkouts (zencodecs needs
# zenjpeg `recompress`, which the published 0.8.4 predates). The Pages deploy
# regenerates this section via ci-prep at build time; local sibling lockstep
# is opt-in via `cargo superwork patch`.
[patch.crates-io]
zenflate = { git = "https://github.com/imazen/zenflate", rev = "43c10e3d04275dae8801802b63fb99176e94b70d" }
zenpredict = { git = "https://github.com/imazen/zenanalyze", rev = "6bbcacb11313923ded6e5eeebb725878c5736453" }
zenresize = { git = "https://github.com/imazen/zenresize", rev = "e3975fb9d6d6b7baa96038a0eb8e27febb37c012" }
zencodec = { git = "https://github.com/imazen/zencodec", rev = "a81daf7605dc63074d4a39757e7b4399057d4a8f" }
# One entry per git-form entry at the workspace root (see the rationale
# comments there); keep the two tables in sync.
# zenjpeg main is 0.9.0 (crates.io tops out at 0.8.4); zenjxl main needs it.
zenjpeg = { git = "https://github.com/imazen/zenjpeg", rev = "7cf22c683f92b53d334d4e1236ecfd99f0a8cd5e" }
# heic main is 0.2.0 (zencodec decode adapter); crates.io tops out at 0.1.6.
heic = { git = "https://github.com/imazen/heic", rev = "6c30bf2545d86e34a734607f0d938291dfc1405b" }
# zentiff main is 0.1.2 on zencodec 0.1.26; crates.io 0.1.2 is pre-adapter.
zentiff = { git = "https://github.com/imazen/zenextras", rev = "2be9bcde317ed31c82f03b91664c3d64a01161c3" }
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "c6ca855703e08378d84ee48d86bed1fc792a96fd" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "c6ca855703e08378d84ee48d86bed1fc792a96fd" }
# Keep legacy HEIC on the 0.5 reconstruction fix while current codecs use 0.6.
ultrahdr-core = { git = "https://github.com/imazen/ultrahdr", rev = "02c49bc5bf60c76d702322c2e089ad204a02228b" }
# zenjxl main is 0.3.0 (`jpeg-lossy`); the published 0.2.1 predates it.
zenjxl = { git = "https://github.com/imazen/zenjxl", rev = "78c64c7e01529125a209405b0e98d196e860e254" }
# jxl-encoder 0.3.2 (lossy-JPEG recompression API) is not yet on crates.io.
jxl-encoder = { git = "https://github.com/imazen/jxl-encoder", rev = "3c1be8179ac7fdb7e7322e299cdad645046acf6c" }
# zenjxl-decoder main is 0.4.0 (the breaking API batch zenjxl 0.3.0 needs);
# crates.io tops out at 0.3.10.
zenjxl-decoder = { git = "https://github.com/imazen/zenjxl-decoder", rev = "f27c5c6fb56b76c952d88aa7d5231a06f7e49b51" }
# zenwebp main is 0.5.0 (Pattern B error boundary, zencodec always-on);
# the last unyanked crates.io release is 0.4.4.
zenwebp = { git = "https://github.com/imazen/zenwebp", rev = "d12fe2bb767461c8740938cf209527dd25ff0cbc" }
# zenpng main is 0.2.0; the published 0.1.4 predates the orientation sweep.
zenpng = { git = "https://github.com/imazen/zenpng", rev = "5bd6610354f66e48d18608060e9663db78a60f1f" }
# zenbitmaps main is 0.2.0 (At<BitmapError>); crates.io tops out at 0.1.5.
zenbitmaps = { git = "https://github.com/imazen/zenbitmaps", rev = "72c13f57ab77e7185e4d28b6b82faaaf1901e4fa" }
# zengif main is 0.8.0 (Pattern B error boundary, zencodec always-on).
zengif = { git = "https://github.com/imazen/zengif", rev = "38984a62d0224918f46e013ebb24cce9c08938a1" }
# zenraw / zenpdf: registry 0.2.0 of both predates the CategorizedError
# taxonomy; their mains are on zencodec 0.1.26.
zenraw = { git = "https://github.com/imazen/zenraw", rev = "c3e02d987fd0b7dbb4de79709ecb304bfcbda382" }
zenpdf = { git = "https://github.com/imazen/zenextras", rev = "2be9bcde317ed31c82f03b91664c3d64a01161c3" }
# Same tested decoder revision as the root, enforced by check-decoder-pins.py.
zenavif = { git = "https://github.com/imazen/zenavif", rev = "ce9378c5553953e2aba95e0ae89e595e80ec994e" }
# zenanalyze-api: unify to one instance with zenpicker/zenpredict's git copy.
zenanalyze-api = { git = "https://github.com/imazen/zenanalyze", rev = "6bbcacb11313923ded6e5eeebb725878c5736453" }
# zenanalyze main is 0.2.0 and git-only (registry is frozen at 0.1.0). zenjpeg
# 147444fe resolves it through a patch at ITS workspace root, which is invisible
# to us, so this graph asks crates.io for `zenanalyze ^0.2.0` and fails to
# resolve. The Pages deploy deletes both lockfiles, so it hit this first (runs
# 33229080325 / 33230408160). See the root manifest for the full rationale.
zenanalyze = { git = "https://github.com/imazen/zenanalyze", rev = "6bbcacb11313923ded6e5eeebb725878c5736453" }
# zennode main has NodeRole variants (DisplayAdjust, ToneMap, …) the published
# 0.1.1 predates (same version number, older content).
zennode = { git = "https://github.com/imazen/zennode" }
zennode-derive = { git = "https://github.com/imazen/zennode" }
# zensim 0.3.0 / zensim-regress 0.4.0 are unpublished (crates.io: 0.2.7 / 0.3.1).
zensim = { git = "https://github.com/imazen/zensim", rev = "8557758809156baba7364bd8cfe32889a61da4e8" }
zensim-regress = { git = "https://github.com/imazen/zensim", rev = "8557758809156baba7364bd8cfe32889a61da4e8" }
# imageflow_types / imageflow_riapi are not published (imageflow-compat feature).
imageflow_types = { git = "https://github.com/imazen/imageflow" }
imageflow_riapi = { git = "https://github.com/imazen/imageflow" }
# zensally / zensally-zentract are not published (nodes-faces feature).
zensally = { git = "https://github.com/imazen/zensally" }
zensally-zentract = { git = "https://github.com/imazen/zensally" }

# Override zenresize's git dep on zenlayout to use our workspace copy

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[profile.release]
opt-level = "z"
lto = true
strip = true
