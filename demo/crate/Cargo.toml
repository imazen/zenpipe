[package]
name = "zenpipe-demo"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["wasm"]
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:web-sys"]
parallel = ["dep:rayon", "dep:wasm-bindgen-rayon"]

[dependencies]
# Platform-agnostic editor model + controller (handles decode, encode, rendering)
zeneditor = { path = "../../zeneditor" }

# Codec types for format detection in WASM glue
zencodec = { version = ">=0.2.0, <0.4.0", default-features = false }

serde_json = "1"

# Multithreaded WASM via rayon (optional — requires SharedArrayBuffer + COOP/COEP)
rayon = { version = "1.10", optional = true }
wasm-bindgen-rayon = { version = "1.3", features = ["no-bundler"], optional = true }

# WASM-specific deps (optional for native testing)
# Pinned exactly: the Pages workflow installs wasm-bindgen-cli at this same
# version, and the bindgen schema requires crate == CLI. Bump both together.
wasm-bindgen = { version = "=0.2.123", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", features = ["ImageData"], optional = true }


[patch.crates-io]
zencodec-testkit = { git = "https://github.com/imazen/zencodec", rev = "3f4fd14feb9bdfed041e426aaa569b236a201158" }
# The optional AVIF tuner resolves this unpublished predictor from the same workspace.
zenpredict = { git = "https://github.com/imazen/zenanalyze", rev = "6bbcacb11313923ded6e5eeebb725878c5736453" }
zenresize = { git = "https://github.com/imazen/zenresize", rev = "dc40e8e642d191c5f45c04745d3cbf29e2fccdd6" }
# Optional borrowed Pulse family; source alignment only, original locks retained.
# Dependencies use version edges, so each consumer root selects this source.
zencodec = { git = "https://github.com/imazen/zencodec", rev = "3f4fd14feb9bdfed041e426aaa569b236a201158" }
zencodec-io = { git = "https://github.com/imazen/zencodec", rev = "3f4fd14feb9bdfed041e426aaa569b236a201158" }
zencodec-coroutine = { git = "https://github.com/imazen/zencodec", rev = "3f4fd14feb9bdfed041e426aaa569b236a201158" }
zenmeta = { git = "https://github.com/imazen/zencodec", rev = "3f4fd14feb9bdfed041e426aaa569b236a201158" }
# Transitive source prerequisites: dependency patch tables do not propagate.
zenflate = { git = "https://github.com/imazen/zenflate", rev = "a0ea03637a2cc9a193e343018ae2cfb1a6c31edd" }
tiff = { git = "https://github.com/lilith/image-tiff", rev = "10a3b6b2fa88eb5943525066a989ea9e64e644d5" }
hayro-syntax = { git = "https://github.com/lilith/hayro", rev = "2ce50d0164878b8505e118f81dcb1d0367b26957" }
# Optional borrowed Pulse JPEG source; consumer qualification remains unrun.
zenjpeg = { git = "https://github.com/imazen/zenjpeg", rev = "9274e38073684876c4283918251f5ccdb4a0b02f" }
# Retained HEIC source still needs its owned-Pulse adapter migration.
# Keep its full-profile/API feature and existing assertions enabled.
heic = { git = "https://github.com/imazen/heic", rev = "20aaffed1213a831b113729db958d57ec29a1a53" }
# Optional-control TIFF source with the matching image-tiff resource-limit fork.
# Consumer resolution, pixel parity and native qualification remain pending.
zentiff = { git = "https://github.com/imazen/zenextras", rev = "403d46b9973a58b212def0602f4dd8cdee9560dc" }
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "18afc75f1fd40c7feafeef6deae4df8e97e5e1b9" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "18afc75f1fd40c7feafeef6deae4df8e97e5e1b9" }
# The consumed ultrahdr-core package uses version edges for shared types.
# Match the source selected by the optional-control codec roots.
ultrahdr-core = { git = "https://github.com/imazen/ultrahdr", rev = "ade3c857f5541aaff3828e0c7fad073bfe109fd9" }
# zenjxl main is 0.3.0 (`jpeg-lossy`); the published 0.2.1 predates it.
zenjxl = { git = "https://github.com/imazen/zenjxl", rev = "a3a93aaf068c589675aa5c63090ac9d07f24d07c" }
# jxl-encoder 0.3.2 (lossy-JPEG recompression API) is not yet on crates.io.
jxl-encoder = { git = "https://github.com/imazen/jxl-encoder", rev = "13b04b6b71c8847b1d95414586c3a8c0023355ef" }
# zenjxl-decoder main is 0.4.0 (the breaking API batch zenjxl 0.3.0 needs);
# crates.io tops out at 0.3.10.
zenjxl-decoder = { git = "https://github.com/imazen/zenjxl-decoder", rev = "e1c366b089b29511ef66f1b5af5d9e208dbff5d1" }
# Optional borrowed Pulse WebP source; consumer qualification remains unrun.
zenwebp = { git = "https://github.com/imazen/zenwebp", rev = "eb96de80bc72eee823241970e03a25f6af50e61a" }
# Optional borrowed Pulse PNG source with its required zenflate source patch.
# Consumer lock resolution and native qualification remain pending.
zenpng = { git = "https://github.com/imazen/zenpng", rev = "8605d8c4443e3bff6273cde438d3adfa0cbdb2b8" }
# Bitmap/QOI optional-control source; consumer qualification remains unrun.
zenbitmaps = { git = "https://github.com/imazen/zenbitmaps", rev = "a690400254ff9f0eba576a89b8e648f7ff790b3f" }
# zengif main is 0.8.0 (Pattern B error boundary, zencodec always-on).
zengif = { git = "https://github.com/imazen/zengif", rev = "a258e93c5bc0b0a5624b521d7103a34b472c5ac9" }
# Retained RAW source still needs its owned-Pulse adapter migration.
# Keep its full-profile/API feature and existing assertions enabled.
zenraw = { git = "https://github.com/imazen/zenraw", rev = "223c6c240f7cda77327e54f972f730766e28653f" }
# Optional-control PDF source with its matching hayro-syntax resource-limit fork.
# Full consumer qualification remains pending.
zenpdf = { git = "https://github.com/imazen/zenextras", rev = "403d46b9973a58b212def0602f4dd8cdee9560dc" }
# AVIF/parse/MP4 optional-control source, matching the direct parser edge.
# Its rav1d-safe source stays b19aec65; orientation expectations are unchanged.
# This consumer graph is unbuilt.
zenavif = { git = "https://github.com/imazen/zenavif", rev = "a93b9fbe85a922524c1a259eedd52c7fd3b526a7" }
# Application-root selection for zenravif's unpublished registry serializer.
zenavif-serialize = { git = "https://github.com/imazen/zenavif", rev = "a93b9fbe85a922524c1a259eedd52c7fd3b526a7" }
# zenanalyze-api: unify to one instance with zenpicker/zenpredict's git copy.
zenanalyze-api = { git = "https://github.com/imazen/zenanalyze", rev = "6bbcacb11313923ded6e5eeebb725878c5736453" }
# zenanalyze main is 0.2.0 and git-only (registry is frozen at 0.1.0). zenjpeg
# 147444fe resolves it through a patch at ITS workspace root, which is invisible
# to us, so this graph asks crates.io for `zenanalyze ^0.2.0` and fails to
# resolve. The Pages deploy deletes both lockfiles, so it hit this first (runs
# 33229080325 / 33230408160). See the root manifest for the full rationale.
zenanalyze = { git = "https://github.com/imazen/zenanalyze", rev = "6bbcacb11313923ded6e5eeebb725878c5736453" }
# zennode main has NodeRole variants (DisplayAdjust, ToneMap, …) the published
# 0.1.1 predates (same version number, older content).
zennode = { git = "https://github.com/imazen/zennode" }
zennode-derive = { git = "https://github.com/imazen/zennode" }
# zensim 0.3.0 / zensim-regress 0.4.0 are unpublished (crates.io: 0.2.7 / 0.3.1).
zensim = { git = "https://github.com/imazen/zensimx", rev = "8557758809156baba7364bd8cfe32889a61da4e8" }
zensim-regress = { git = "https://github.com/imazen/zensimx", rev = "8557758809156baba7364bd8cfe32889a61da4e8" }
# imageflow_types / imageflow_riapi are not published (imageflow-compat feature).
imageflow_types = { git = "https://github.com/imazen/imageflow" }
imageflow_riapi = { git = "https://github.com/imazen/imageflow" }
# zensally / zensally-zentract are not published (nodes-faces feature).
zensally = { git = "https://github.com/imazen/zensally" }
zensally-zentract = { git = "https://github.com/imazen/zensally" }

[patch."https://github.com/imazen/zenlayout.git"]
zenlayout = { path = "../../zenlayout" }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[profile.release]
opt-level = "z"
lto = true
strip = true
