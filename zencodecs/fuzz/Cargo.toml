[package]
name = "zencodecs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
enough = "0.4.3"

zencodec = "0.1.26"
zenpixels = { version = "0.2.10", default-features = false }
codec-corpus = { path = "../../../codec-corpus/crate" }

[dependencies.zencodecs]
path = ".."
# Use all decodable codecs + encoders that build.
# Excluded: avif-encode (zenrav1e build error), jxl-encode (jxl-encoder build error)
# Excluded: raw-decode-gainmap (requires jpeg-ultrahdr which needs std features)
# Excluded: heic-decode, bitmaps-qoi, bitmaps-tga, bitmaps-hdr — these are
# `compile_error!` stubs in zencodecs (no backend wired yet, zenpipe#43);
# enabling them only floods unresolved-item errors. Re-add each when its
# backend lands.
# Excluded: raw-decode, raw-decode-exif — RAW/DNG decode is a thin wrapper over
# the third-party `rawler`/`rawloader` crates, which are NOT panic-safe on
# untrusted input (bit-reader OOB at rawler-0.7.2 bits.rs:205) and allocate from
# attacker-controlled header dimensions before our limits apply (decode bombs).
# Format detection routes any TIFF-magic input straight into rawler, so fuzzing
# through zencodecs just rediscovers rawler-internal bugs we cannot fix here.
# Production hardening / the rawler dep decision is tracked separately. Re-add
# (ideally as a dedicated fuzz target whose findings file against rawler) once
# RAW is panic-safe for untrusted input.
features = [
    "jpeg", "webp", "gif", "gif-zenquant",
    "png", "png-zenquant", "avif-decode", "jxl-decode",
    "bitmaps", "bitmaps-bmp",
    "cms", "riapi",
    "jpeg-ultrahdr",
]

# Prevent workspace interference
[workspace]
members = ["."]

# The repo-root `.cargo/config.toml` carries a transient dogfood `paths`
# override for zencodec / zenpixels / zenpixels-convert (the concurrent HDR
# work). A crate listed in BOTH that `paths` override and this `[patch]` block
# errors with "found patches and a path override", so zencodec is NOT patched
# here — it comes from the `paths` override. zenavif-parse / zenjpeg / zenrav1e
# are not in `paths`, so they stay here.
[patch.crates-io]
# zenavif 0.1.7 (registry 0.1.7 is yanked): zencodecs' avif-decode requires
# ^0.1.7, and the repo-root [patch.crates-io] does not reach this separate
# fuzz workspace, so patch it to the sibling checkout (its workspace root).
zenavif = { path = "../../../zenavif" }
# Unpublished mains the root [patch.crates-io] pins (see its comments):
# zengif 0.8 / zenwebp 0.5 / zenpng 0.2 (zencodec Pattern B error boundary),
# zenjxl + zenjxl-decoder (mode-aware orientation API). Mirrored here because
# this fuzz workspace resolves on its own.
zengif = { git = "https://github.com/imazen/zengif" }
zenwebp = { git = "https://github.com/imazen/zenwebp" }
zenpng = { git = "https://github.com/imazen/zenpng" }
zenjxl = { git = "https://github.com/imazen/zenjxl" }
zenjxl-decoder = { git = "https://github.com/imazen/zenjxl-decoder" }
# zenavif-parse 0.7.0 is a member of the imazen/zenavif workspace (the
# standalone repo is archived) — same sibling the root/zencodecs manifests use.
zenavif-parse = { path = "../../../zenavif/zenavif-parse" }
# zenbitmaps main is 0.2.0 (PNM/BMP decode-bomb bound + At<BitmapError>); fuzz_push_decode's
# bitmaps path needs it to be panic/OOM-safe on untrusted input (zenpipe#50).
zenbitmaps = { path = "../../../zenbitmaps" }
zenjpeg = { path = "../../../zenjpeg/zenjpeg" }
# Needed by the jpeg-ultrahdr feature (gain-map decode). As a real path-patch
# its `zencodec = { workspace = true }` resolves against its own workspace root
# (~/work/zen/ultrahdr/Cargo.toml).
ultrahdr-core = { path = "../../../ultrahdr/ultrahdr-core" }
# zenrav1e needs no entry: zenavif → zenravif → zenrav1e are git-rev deps on
# their own dep lines (no registry requirement exists), so a patch here is
# reported unused.

[profile.release]
debug = 1
opt-level = 3

[[bin]]
name = "fuzz_probe"
path = "fuzz_targets/fuzz_probe.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_decode"
path = "fuzz_targets/fuzz_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_decode_limits"
path = "fuzz_targets/fuzz_decode_limits.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_push_decode"
path = "fuzz_targets/fuzz_push_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_animation"
path = "fuzz_targets/fuzz_animation.rs"
