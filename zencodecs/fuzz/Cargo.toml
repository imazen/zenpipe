[package]
name = "zencodecs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
enough = "0.4.3"

zencodec = ">=0.1.26, <0.3.0"
zenpixels = { version = ">=0.2.10, <0.4.0", default-features = false }
codec-corpus = "1.1.0"

[dependencies.zencodecs]
path = ".."
# Use all decodable codecs + encoders that build.
# Excluded: avif-encode (zenrav1e build error), jxl-encode (jxl-encoder build error)
# Excluded: raw-decode-gainmap (requires jpeg-ultrahdr which needs std features)
# Excluded: bitmaps-qoi, bitmaps-tga, bitmaps-hdr — these are
# `compile_error!` stubs in zencodecs (no backend wired yet, zenpipe#43);
# enabling them only floods unresolved-item errors. Re-add each when its
# backend lands.
# Excluded: raw-decode, raw-decode-exif — RAW/DNG decode is a thin wrapper over
# the third-party `rawler`/`rawloader` crates, which are NOT panic-safe on
# untrusted input (bit-reader OOB at rawler-0.7.2 bits.rs:205) and allocate from
# attacker-controlled header dimensions before our limits apply (decode bombs).
# Format detection routes any TIFF-magic input straight into rawler, so fuzzing
# through zencodecs just rediscovers rawler-internal bugs we cannot fix here.
# Production hardening / the rawler dep decision is tracked separately. Re-add
# (ideally as a dedicated fuzz target whose findings file against rawler) once
# RAW is panic-safe for untrusted input.
features = [
    "jpeg", "webp", "gif", "gif-zenquant",
    "png", "png-zenquant", "avif-decode", "jxl-decode",
    "bitmaps", "bitmaps-bmp",
    "cms", "riapi",
    "jpeg-ultrahdr", "metadata",
]

# Prevent workspace interference
[workspace]
members = ["."]

# This standalone fuzz workspace does not inherit the root patch table.
# Keep its decoder/parser source aligned with zencodecs' direct parser pin.
[patch.crates-io]
# zenavif 0.1.7 (registry 0.1.7 is yanked): zencodecs' avif-decode requires
# ^0.1.7, and the repo-root [patch.crates-io] does not reach this separate
# fuzz workspace. Use the same 0.1.7 git revision as the production adapter;
# current sibling main is 0.2.0 and cannot satisfy this requirement.
# Use the same streaming interface revision as the production workspace.
zencodec = { git = "https://github.com/imazen/zencodec", rev = "d327434b0826a3e39633665c76f5081c0ceb34cc" }
zenavif = { git = "https://github.com/imazen/zenavif", rev = "f29fd4d1ea0ad928164ca9a7dac9306fa7dcc305" }
# Unpublished mains the root [patch.crates-io] pins (see its comments):
# zengif 0.8 / zenwebp 0.5 / zenpng 0.2 (zencodec Pattern B error boundary),
# zenjxl + zenjxl-decoder (mode-aware orientation API). Mirrored here because
# this fuzz workspace resolves on its own.
zengif = { git = "https://github.com/imazen/zengif" }
zenwebp = { git = "https://github.com/imazen/zenwebp", rev = "b5f28c976a0b285ec56ddc9301d5e1ed10a8e99f" }
zenpng = { git = "https://github.com/imazen/zenpng", rev = "fb0553964406c010901d6c95b3a34b8b3529b0f1" }
zenjxl = { git = "https://github.com/imazen/zenjxl" }
zenjxl-decoder = { git = "https://github.com/imazen/zenjxl-decoder" }
# zenavif-parse 0.7.0 is a member of the imazen/zenavif workspace (the
# standalone repo is archived), pinned to the same revision as the decoder.
zenavif-parse = { git = "https://github.com/imazen/zenavif", rev = "f29fd4d1ea0ad928164ca9a7dac9306fa7dcc305" }
# zenbitmaps main is 0.2.0 (PNM/BMP decode-bomb bound + At<BitmapError>); fuzz_push_decode's
# bitmaps path needs it to be panic/OOM-safe on untrusted input (zenpipe#50).
# heic main is 0.2.0; the registry 0.2.0 is yanked. Same entry as the root table.
heic = { git = "https://github.com/imazen/heic" }
# zencodecs' `inventory` feature names `zentiff?/inventory`, `zenraw?/inventory`
# and `zenpdf?/inventory`; cargo checks those against every candidate, and the
# registry releases predate the feature. Same entries as the root table.
zentiff = { git = "https://github.com/imazen/zenextras" }
zenraw = { git = "https://github.com/imazen/zenraw" }
zenpdf = { git = "https://github.com/imazen/zenextras" }
zenbitmaps = { git = "https://github.com/imazen/zenbitmaps" }
zenjpeg = { git = "https://github.com/imazen/zenjpeg", rev = "4196fa93d422bc367d1e3ddadbaddfe672b9cdfc" }
# zenjpeg resolves `zenanalyze 0.2.0` through a [patch.crates-io] at the zenjpeg
# WORKSPACE root; when consumed as a dependency that table never
# applies, and the registry is frozen at 0.1.0 — so a fresh resolve here fails
# with "failed to select a version for the requirement `zenanalyze = ^0.2.0`".
zenanalyze = { git = "https://github.com/imazen/zenanalyze" }
# Match the 0.5.x reconstruction patch in the other fuzz workspace.
# The 0.6.x gain-map encoder continues to resolve from the registry.
ultrahdr-core = { git = "https://github.com/imazen/ultrahdr", rev = "a834b2ccedc2b99b1fec3200365f00127a6baea6" }
# zenrav1e needs no entry: zenavif → zenravif → zenrav1e are git-rev deps on
# their own dep lines (no registry requirement exists), so a patch here is
# reported unused.

[profile.release]
debug = 1
opt-level = 3

[[bin]]
name = "fuzz_probe"
path = "fuzz_targets/fuzz_probe.rs"
test = false
doc = false
bench = false

