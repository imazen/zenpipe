[package]
name = "zencodecs"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-or-later"
description = "Unified image codec abstraction over zenjpeg, zenwebp, zengif, zenavif, png, and ravif"
categories = ["multimedia::images"]
keywords = ["image", "codec", "jpeg", "webp", "avif"]
repository = "https://github.com/imazen/zencodecs"
exclude = ["CLAUDE.md", "CONTEXT-HANDOFF.md", "FEEDBACK.md", ".claude/", ".superwork/", ".zenbench/", "copter-report/", ".github/", "Cross.toml", "justfile", "Cargo.toml.original.txt", "fuzz/", "benchmarks/", "*.zst"]

[dependencies]
# Core (always available)
enough = "0.4"
whereat = "0.1.4"
thiserror = { version = "2.0", default-features = false }
rgb = { version = "0.8", default-features = false, features = ["as-bytes"] }
imgref = "1.12"
bytemuck = { version = "1.25", default-features = false, features = ["extern_crate_alloc"] }
zencodec = { path = "../../zencodec" }
zenpixels = { version = "0.2.10", path = "../../zenpixels/zenpixels", default-features = false, features = ["imgref"] }
zenpixels-convert = { version = "0.2.10", path = "../../zenpixels/zenpixels-convert", features = ["imgref"] }
linear-srgb = { version = "0.6.3", default-features = false }

# Codecs (all optional, feature-gated)
zenjpeg = { path = "../../zenjpeg/zenjpeg", optional = true, features = ["decoder", "zencodec", "trellis", "recompress"] }
# UltraHDR gain-map math + the `pixel_buffer_from_vec` constructor (unifies with
# the copy zenjpeg pulls in). Gated with jpeg-ultrahdr.
ultrahdr-core = { version = "0.5.0", optional = true, default-features = false }
zenwebp = { path = "../../zenwebp", optional = true, features = ["zencodec"] }
zengif = { path = "../../zengif", optional = true, features = ["zencodec"] }
zenavif = { path = "../../zenavif", optional = true, features = ["zencodec"] }
zenavif-parse = { path = "../../zenavif-parse", optional = true, features = ["eager"] }
zenpng = { path = "../../zenpng", optional = true, features = ["zencodec"] }
zenjxl = { path = "../../zenjxl", optional = true, default-features = false, features = ["zencodec"] }
# Lossless JXL→JPEG reconstruction (reconstruct_jpeg, JBRD / brunsli-parity). Its
# `jpeg` feature pulls brotli for the JBRD box; needs neither zenjpeg nor the JXL
# encoder, so the reconstruct direction builds independently. Patched to the local
# 0.3.8 at the workspace root (crates.io tops out at 0.3.7).
zenjxl-decoder = { version = "0.3.8", optional = true, features = ["jpeg"] }
# heic-decoder = { path = "../../heic-decoder-rs", optional = true, default-features = false, features = ["zencodec"] }  # not cloned locally
zenbitmaps = { path = "../../zenbitmaps", optional = true, features = ["zencodec"] }
zenraw = { path = "../../zenraw", optional = true, default-features = false, features = ["rawloader", "rawler", "std", "zencodec", "exif"] }

# Node definitions (optional)
zennode = { path = "../../zennode/zennode", default-features = false, features = ["derive"], optional = true }

# Color management (optional)
moxcms = { version = "0.7", optional = true, default-features = false }

# Quality-targeted transcode scorer (optional): zensim Profile-A metric for the
# general decode→re-encode quality loop (transcode_to_quality). Lean build — no
# threads/avx512 forced; SIMD still dispatches at runtime.
zensim = { version = "0.3.0", path = "../../zensim/zensim", optional = true, default-features = false, features = ["imgref"] }

[dev-dependencies]
png = "0.18"
zensim-regress = { path = "../../zensim/zensim-regress" }
codec-corpus = "1"
fast-ssim2 = { path = "../../fast-ssim2/fast-ssim2", features = ["imgref"] }
rayon = "1"
turbojpeg = "1.4"

[features]
default = ["jpeg", "webp", "gif", "gif-zenquant", "png", "png-zenquant", "avif-decode", "avif-encode", "jxl-decode", "bitmaps-bmp"]
std = []

# Quality-targeted transcode: wire the scorer-driven routes in
# `transcode_to_quality` (the zensim Profile-A scorer + zenjxl's JPEG→JXL
# coefficient-domain recompressor). Without it, only the self-contained
# JPEG→JPEG recompress route is wired. `zenjxl?/jpeg-lossy` only fires when a
# jxl feature has already pulled in zenjxl.
transcode-iqa = ["dep:zensim", "zenjxl?/jpeg-lossy"]

# Individual codec features
jpeg = ["dep:zenjpeg"]
jpeg-ultrahdr = ["jpeg", "zenjpeg/ultrahdr", "dep:ultrahdr-core"]
webp = ["dep:zenwebp"]
gif = ["dep:zengif"]
gif-zenquant = ["gif", "zengif/zenquant"]
gif-quantizr = ["gif", "zengif/quantizr"]
gif-imagequant = ["gif", "zengif/imagequant"]
png = ["dep:zenpng"]
png-zenquant = ["png", "zenpng/quantize"]
avif-decode = ["dep:zenavif"]
avif-encode = ["dep:zenavif", "zenavif/encode", "dep:zenavif-parse"]
jxl-decode = ["dep:zenjxl", "zenjxl/decode"]
jxl-encode = ["dep:zenjxl", "zenjxl/encode"]

# Lossless JXL→JPEG reconstruction (reconstruct_jpeg_from_jxl; JBRD / brunsli-parity).
# Decode-side only: zenjxl-decoder + brotli for the JBRD box. Independent of the
# JPEG/JXL encoders, so it builds without the lossy/encoder chain.
jxl-jpeg-reconstruct = ["dep:zenjxl-decoder"]

# Lossless byte-exact JPEG→JXL transcode (transcode_jpeg_to_jxl_lossless) via zenjxl's
# LosslessConfig::encode_jpeg_transcode (jxl-encoder `jpeg-reencoding`, pulled by
# zenjxl/jpeg-lossy). Pulls the reconstruct side so a round-trip is self-contained.
jpeg-jxl-transcode = ["jxl-encode", "jxl-jpeg-reconstruct", "zenjxl/jpeg-lossy"]
heic-decode = []  # stub — heic-decoder not cloned locally
tiff = []  # stub — zentiff integration pending
svg = []  # stub — zensvg crate not cloned locally
jp2-decode = []  # stub — zenjp2 crate not cloned locally
bitmaps = ["dep:zenbitmaps"]
bitmaps-bmp = ["bitmaps", "zenbitmaps/bmp"]
bitmaps-hdr = ["bitmaps"]  # stub — HDR bitmap support pending
bitmaps-qoi = ["bitmaps"]  # stub — QOI support pending
bitmaps-tga = ["bitmaps"]  # stub — TGA support pending
raw-decode = ["dep:zenraw"]
raw-decode-exif = ["raw-decode", "zenraw/exif"]
raw-decode-xmp = ["raw-decode", "zenraw/xmp"]
raw-decode-gainmap = ["raw-decode", "zenraw/apple", "jpeg-ultrahdr"]

# RIAPI codec key parsing
riapi = []

# zennode node definitions
zennode = ["dep:zennode"]

# Color management
cms = ["dep:moxcms"]
moxcms = ["dep:moxcms"]  # alias for back-compat

# All codecs
all = ["jpeg", "jpeg-ultrahdr", "webp", "gif", "gif-zenquant", "gif-quantizr", "png", "png-zenquant", "avif-decode", "avif-encode", "jxl-decode", "jxl-encode", "bitmaps-bmp", "raw-decode", "raw-decode-exif", "raw-decode-xmp", "raw-decode-gainmap"]

# Calibration harness (all lossy encoders)
calibrate = ["jpeg", "webp", "png", "avif-decode", "avif-encode", "jxl-decode", "jxl-encode", "std"]

# Tests that read fixtures only present on the dev workstation (sibling
# jpegli-cpp profile trees, /mnt/v corpora). The skip decision is the
# caller's: CI never enables this; `just test-local-fixtures` does.
local-fixtures = []

[[example]]
name = "metadata_roundtrip"
required-features = ["all", "std"]

[[example]]
name = "gainmap_roundtrip"
required-features = ["all", "std"]

[[example]]
name = "gainmap_inspect"
required-features = ["jpeg-ultrahdr", "std"]

[[example]]
name = "icc_roundtrip"
required-features = ["all", "std"]

[[example]]
name = "wasm_roundtrip"
required-features = ["std"]

[[example]]
name = "bench_wasm"
required-features = ["std"]

[[example]]
name = "heaptrack_zencodec_traits"
required-features = ["std"]

[[example]]
name = "quality_calibrate"
required-features = ["calibrate"]

# icc_srgb reads real ICC profiles from the sibling zenjpeg jpegli-cpp
# tree (dev-workstation only) — see the `local-fixtures` feature.
[[test]]
name = "icc_srgb"
required-features = ["local-fixtures"]

# Checksum regression baselines are recorded under the full feature set
# (`UPDATE_CHECKSUMS=1 cargo test --features all --test regress` per the
# module docs); running under a different set produces different encoder
# output and false drift. Encode that contract here.
[[test]]
name = "regress"
required-features = ["all"]

# Every test in this binary forwards stop tokens / limits through real
# codec encode+decode; with no codecs compiled in there is nothing to
# test. avif legs are additionally cfg-gated on `avif-encode` inside.
[[test]]
name = "stop_and_limits"
required-features = ["jpeg", "webp", "gif"]

# [patch.crates-io] moved to workspace root Cargo.toml

