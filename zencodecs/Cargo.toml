[package]
name = "zencodecs"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
description = "Unified image codec dispatch over the zen codecs (JPEG, PNG, WebP, GIF, AVIF, JXL, HEIC, TIFF, RAW, and more)"
categories = ["multimedia::images"]
keywords = ["image", "codec", "jpeg", "webp", "avif"]
repository = "https://github.com/imazen/zenpipe"
readme = "README.crates.md"
exclude = ["CLAUDE.md", "CONTEXT-HANDOFF.md", "FEEDBACK.md", ".claude/", ".superwork/", ".zenbench/", "copter-report/", ".github/", "Cross.toml", "justfile", "Cargo.toml.original.txt", "fuzz/", "benchmarks/", "docs/", "*.zst"]

[dependencies]
# Core (always available)
enough = "0.4"
whereat = "0.1.4"
thiserror = { version = "2.0", default-features = false }
rgb = { version = "0.8", default-features = false, features = ["as-bytes"] }
imgref = "1.12"
bytemuck = { version = "1.25", default-features = false, features = ["extern_crate_alloc"] }
zencodec = { version = "0.1.26" }
# MLP content-aware format picker (optional `picker` feature). Git-dep'd until
# zenpicker is published — flip to crates.io then. zenpicker is codec-agnostic
# (returns its own CodecFamily); the adapter in picker.rs maps to ImageFormat.
zenpicker = { git = "https://github.com/imazen/zenanalyze", optional = true }
zenpredict = { git = "https://github.com/imazen/zenanalyze", optional = true }
# Zero-dep version-unifying feature contract (Request / Offer / NamedFeature) for
# the `picker-api` route. Published at 0.1.0. zenpicker's internal dep is
# `{ version = "0.1.0", path }`; consumed via git, that resolves to this same
# registry crate, so the `zenanalyze_api` types unify to one instance.
zenanalyze-api = { version = "0.1.0", optional = true, default-features = false }
zenpixels = { version = "0.2.10", default-features = false, features = ["imgref"] }
zenpixels-convert = { version = "0.2.10", features = ["imgref"] }
linear-srgb = { version = "0.6.3", default-features = false }

# Codecs (all optional, feature-gated)
# zenjpeg 0.9.0 (git main) dropped the no-op `decoder`/`trellis` features —
# both are always compiled now; `recompress` is still a real gate.
zenjpeg = { version = "0.9.0", optional = true, features = ["zencodec", "recompress"] }
# UltraHDR gain-map math + the `pixel_buffer_from_vec` constructor (unifies with
# the copy zenjpeg 0.9.0 pulls in — registry 0.6.0). Gated with jpeg-ultrahdr.
ultrahdr-core = { version = "0.6.0", optional = true, default-features = false }
# zenwebp main made `zencodec` a required, always-on dependency (no cargo
# feature) as part of its Pattern B error boundary migration (#69); its
# `zencodec` feature no longer exists. The codec adapter module isn't
# std-gated, so no replacement feature is needed (unlike zengif above).
zenwebp = { version = "0.5.0", optional = true }
# zengif main made `zencodec` a required, always-on dependency (no cargo
# feature); its `zencodec` feature no longer exists (imazen/zengif#13). Default
# features (`std` + `zenquant`) already cover what the old `zencodec` feature
# implied.
zengif = { version = "0.8.0", optional = true }
# Registry 0.1.6 on purpose (pre-taxonomy but additive-compatible with zencodec
# 0.1.26): zenavif main's `encode` chain (zenravif 0.2.0 → path-only zenrav1e)
# is unpublished and cannot resolve from git — see the workspace-root
# [patch.crates-io] note. Drop `features = ["zencodec"]` when moving to 0.1.7+.
zenavif = { version = "0.1.6", optional = true, features = ["zencodec"] }
# Pure-Rust HEIC/HEIF decode (base SDR + gain-map HDR reconstruct via ultrahdr-core).
# crates.io tops out at 0.1.6 (pre-adapter); patched to imazen/heic git main below.
heic = { version = "0.2.0", optional = true, default-features = false, features = ["backend-rust", "zencodec"] }
zenavif-parse = { version = "0.6.2", optional = true, features = ["eager"] }
zenpng = { version = "0.2.0", optional = true, features = ["zencodec"] }
# Pure-Rust TIFF decode/encode (zencodec adapter + heaptrack-calibrated estimate).
# crates.io tops out at 0.1.2 (pre-adapter, on zencodec ^0.1.19); patched to
# imazen/zenextras git main at the workspace root. Powers `tiff` (zenpipe#43).
zentiff = { version = "0.1.2", optional = true, features = ["zencodec"] }
# SVG/SVGZ rasterization (resvg) behind a zencodec decode adapter. Unpublished —
# lives in the imazen/zenextras workspace next to zentiff, so it is a git dep
# rather than a registry spec + root patch. Powers `svg` (zenpipe#1).
zensvg = { git = "https://github.com/imazen/zenextras", optional = true }
zenjxl = { version = "0.3.0", optional = true, default-features = false, features = ["zencodec"] }
# Lossless JXL→JPEG reconstruction (reconstruct_jpeg, JBRD / brunsli-parity). Its
# `jpeg` feature pulls brotli for the JBRD box; needs neither zenjpeg nor the JXL
# encoder, so the reconstruct direction builds independently. The workspace-root
# git patch tracks zenjxl-decoder main (0.4.0 — the breaking API batch zenjxl
# 0.3.0 requires; crates.io tops out at 0.3.10).
zenjxl-decoder = { version = "0.4.0", optional = true, features = ["jpeg"] }
# heic-decoder = { path = "../../heic-decoder-rs", optional = true, default-features = false, features = ["zencodec"] }  # not cloned locally
zenbitmaps = { version = "0.2.0", optional = true, features = ["zencodec"] }
# Registry zenraw 0.2.0 / zenpdf 0.2.0 predate zencodec's CategorizedError
# taxonomy; both are git-patched at the workspace root to their mains (zenraw /
# zenextras), which are on zencodec 0.1.26.
zenraw = { version = "0.2.0", optional = true, default-features = false, features = ["rawloader", "rawler", "std", "zencodec", "exif"] }
# PDF page rendering via the hayro engine (decode-only; renders pages to RGBA8).
# Optional and out of default — hayro is a heavy dependency.
zenpdf = { version = "0.2.0", optional = true, default-features = false, features = ["zencodec"] }

# Node definitions (optional)
zennode = { version = "0.1.1", default-features = false, features = ["derive"], optional = true }

# Color management (optional)
moxcms = { version = ">=0.8.1, <0.10", optional = true, default-features = false }

# Quality-targeted transcode scorer (optional): zensim Profile-A metric for the
# general decode→re-encode quality loop (transcode_to_quality). Lean build — no
# threads/avx512 forced; SIMD still dispatches at runtime.
zensim = { version = "0.3.0", optional = true, default-features = false, features = ["imgref"] }

[dev-dependencies]
png = "0.18"
# 0.4.0 unpublished (crates.io tops out at 0.3.1); resolved by the workspace-root
# git patch; CI paths it to the sibling clone.
zensim-regress = { version = "0.4.0" }
codec-corpus = "1"
fast-ssim2 = { version = "0.8.2", features = ["imgref"] }
rayon = "1"
turbojpeg = "1.4"

[features]
default = ["jpeg", "webp", "gif", "gif-zenquant", "png", "png-zenquant", "avif-decode", "avif-encode", "jxl-decode", "bitmaps-bmp"]
std = []

# Content-aware auto-format selection via an injected MLP (zenpicker over
# zenanalyze features) — provides `MlpFormatPicker`, a `FormatPicker` impl.
# Git-dep'd until zenpicker is published, then crates.io. Off by default so the
# core stays dependency-light + publishable. Enables zenpredict's `advanced`
# methods for the scorer-driven `pick_with_budget`.
picker = ["dep:zenpicker", "dep:zenpredict", "zenpredict/advanced"]

# Adds `MlpFormatPicker::pick_from_offer` — feature-reuse negotiation against a
# `zenanalyze_api::Offer` so one zenanalyze pass can feed many consumers. Pulls
# the zero-dep `zenanalyze-api` contract crate + zenpicker's `api` surface.
picker-api = ["picker", "zenpicker/api", "dep:zenanalyze-api"]

# Quality-targeted transcode: wire the scorer-driven routes in
# `transcode_to_quality` (the zensim Profile-A scorer + zenjxl's JPEG→JXL
# coefficient-domain recompressor). Without it, only the self-contained
# JPEG→JPEG recompress route is wired. `zenjxl?/jpeg-lossy` only fires when a
# jxl feature has already pulled in zenjxl.
transcode-iqa = ["dep:zensim", "zenjxl?/jpeg-lossy"]

# Individual codec features
jpeg = ["dep:zenjpeg"]
jpeg-ultrahdr = ["jpeg", "zenjpeg/ultrahdr", "dep:ultrahdr-core"]
webp = ["dep:zenwebp"]
gif = ["dep:zengif"]
gif-zenquant = ["gif", "zengif/zenquant"]
gif-quantizr = ["gif", "zengif/quantizr"]
gif-imagequant = ["gif", "zengif/imagequant"]
png = ["dep:zenpng"]
png-zenquant = ["png", "zenpng/quantize"]
avif-decode = ["dep:zenavif"]
avif-encode = ["dep:zenavif", "zenavif/encode", "dep:zenavif-parse"]
jxl-decode = ["dep:zenjxl", "zenjxl/decode"]
jxl-encode = ["dep:zenjxl", "zenjxl/encode"]

# Lossless JXL→JPEG reconstruction (reconstruct_jpeg_from_jxl; JBRD / brunsli-parity).
# Decode-side only: zenjxl-decoder + brotli for the JBRD box. Independent of the
# JPEG/JXL encoders, so it builds without the lossy/encoder chain.
jxl-jpeg-reconstruct = ["dep:zenjxl-decoder"]

# Lossless byte-exact JPEG→JXL transcode (transcode_jpeg_to_jxl_lossless) via zenjxl's
# LosslessConfig::encode_jpeg_transcode (jxl-encoder `jpeg-reencoding`, pulled by
# zenjxl/jpeg-lossy). Pulls the reconstruct side so a round-trip is self-contained.
jpeg-jxl-transcode = ["jxl-encode", "jxl-jpeg-reconstruct", "zenjxl/jpeg-lossy"]
heic-decode = ["dep:heic"]  # pure-Rust HEIC/HEIF decode via the `heic` crate (zenpipe#43)
tiff = ["dep:zentiff"]  # zentiff decode/encode adapter (git-patched main; zenpipe#43)
svg = ["dep:zensvg"]  # SVG/SVGZ rasterization via zensvg (resvg); zenpipe#1
jp2-decode = []  # stub — compile_error until a JPEG 2000 decoder is wired (zenpipe#43)
bitmaps = ["dep:zenbitmaps"]
bitmaps-bmp = ["bitmaps", "zenbitmaps/bmp"]
bitmaps-hdr = ["bitmaps", "zenbitmaps/hdr"]
bitmaps-qoi = ["bitmaps", "zenbitmaps/qoi"]
bitmaps-tga = ["bitmaps", "zenbitmaps/tga"]
raw-decode = ["dep:zenraw"]
raw-decode-exif = ["raw-decode", "zenraw/exif"]
raw-decode-xmp = ["raw-decode", "zenraw/xmp"]
raw-decode-gainmap = ["raw-decode", "zenraw/apple", "jpeg-ultrahdr"]

# PDF page rendering (decode-only) via zenpdf + the hayro engine. Renders the
# first page to RGBA8; the page count is reported via the probe `ImageInfo`.
# Opt-in — hayro is a heavy dependency, so it stays out of `default` and `all`.
pdf-decode = ["dep:zenpdf"]

# RIAPI codec key parsing
riapi = []

# zennode node definitions
zennode = ["dep:zennode"]

# Color management
cms = ["dep:moxcms"]
moxcms = ["dep:moxcms"]  # alias for back-compat

# All codecs
all = ["jpeg", "jpeg-ultrahdr", "webp", "gif", "gif-zenquant", "gif-quantizr", "png", "png-zenquant", "avif-decode", "avif-encode", "jxl-decode", "jxl-encode", "heic-decode", "bitmaps-bmp", "raw-decode", "raw-decode-exif", "raw-decode-xmp", "raw-decode-gainmap"]

# Calibration harness (all lossy encoders)
calibrate = ["jpeg", "webp", "png", "avif-decode", "avif-encode", "jxl-decode", "jxl-encode", "std"]

# Tests that read fixtures only present on the dev workstation (sibling
# jpegli-cpp profile trees, /mnt/v corpora). The skip decision is the
# caller's: CI never enables this; `just test-local-fixtures` does.
local-fixtures = []

[[example]]
name = "metadata_roundtrip"
required-features = ["all", "std"]

[[example]]
name = "gainmap_roundtrip"
required-features = ["all", "std"]

[[example]]
name = "gainmap_inspect"
required-features = ["jpeg-ultrahdr", "std"]

[[example]]
name = "icc_roundtrip"
required-features = ["all", "std"]

[[example]]
name = "wasm_roundtrip"
required-features = ["std"]

[[example]]
name = "bench_wasm"
required-features = ["std"]

[[example]]
name = "heaptrack_zencodec_traits"
required-features = ["std"]

[[example]]
name = "quality_calibrate"
required-features = ["calibrate"]

# icc_srgb reads real ICC profiles from the sibling zenjpeg jpegli-cpp
# tree (dev-workstation only) — see the `local-fixtures` feature.
[[test]]
name = "icc_srgb"
required-features = ["local-fixtures"]

# Checksum regression baselines are recorded under the full feature set
# (`UPDATE_CHECKSUMS=1 cargo test --features all --test regress` per the
# module docs); running under a different set produces different encoder
# output and false drift. Encode that contract here.
[[test]]
name = "regress"
required-features = ["all"]

# Every test in this binary forwards stop tokens / limits through real
# codec encode+decode; with no codecs compiled in there is nothing to
# test. avif legs are additionally cfg-gated on `avif-encode` inside.
[[test]]
name = "stop_and_limits"
required-features = ["jpeg", "webp", "gif"]

# Cross-codec transcode conformance: needs the core codec corpus to have
# anything to transcode between (per-codec entries are cfg-gated inside).
[[test]]
name = "metadata_conformance"
required-features = ["jpeg", "webp", "png", "gif"]

# Corpus roundtrips and stop-latency probes drive real codecs; the
# binaries are empty shells without them.
[[test]]
name = "corpus"
required-features = ["jpeg", "webp", "png", "gif"]

[[test]]
name = "stop_latency"
required-features = ["jpeg", "webp", "png", "gif"]

# [patch.crates-io] moved to workspace root Cargo.toml

