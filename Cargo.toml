[package]
name = "zenpipe"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
description = "Streaming pixel pipeline — zero-materialization graph execution over zen crates"
repository = "https://github.com/imazen/zenpipe"
readme = "README.crates.md"
keywords = ["image", "pipeline", "streaming", "scanline"]
categories = ["graphics", "multimedia::images"]
exclude = [
    "docs/",
    "CLAUDE.md",
    "CONTEXT-HANDOFF.md",
    "FEEDBACK.md",
    ".claude/",
    ".superwork/",
    ".zenbench/",
    "copter-report/",
    ".github/",
    "Cross.toml",
    "justfile",
    "Cargo.toml.original.txt",
    "fuzz/",
]

[features]
default = ["std", "lossless-jpeg"]
# Enables zenfilters, moxcms ICC CMS, and std on all deps.
# Without this feature, the core pipeline still works (resize, blend, codec,
# animation, format conversion) in a no_std + alloc environment.
std = [
    "zenresize/std",
    "zenpixels-convert/std",
    "zenpixels-convert/cms-moxcms",
    "enough/std",
    "dep:zenfilters",
    "dep:moxcms",
]
# Pipelines over zencodec-io drivers (`zenpipe::io`): controlled decode from
# slices, files and range sources; planned, policy-admitted row encoding to
# forward or seek-back destinations.
io = ["std", "dep:zencodec-io", "zencodec-io/std"]
# `zenpipe::io::tokio_bridge`: run planned pipelines on Tokio's blocking pool
# with async sources and async writers. Never starts a runtime.
io-tokio = ["io", "zencodec-io/tokio", "dep:tokio"]
# Bridge from zennode NodeInstance to PipelineGraph NodeOps.
zennode = ["dep:zennode", "dep:zencodecs", "zencodecs/zennode"]
# Local-dev only: gate bridge tests requiring zennode_defs modules in zenresize/zenlayout.
# These modules are WIP (commented out in those crates) and not available via git. Never enabled in CI.
zennode-defs = ["zennode"]
# High-level bytes-in/bytes-out job API (requires zennode + std + zencodecs CMS).
# `jpeg-ultrahdr` (gain-map encode) is intentionally NOT forced here, so plain
# web delivery (decode -> resize -> re-encode) builds without the UltraHDR stack.
# GainMapMetadata is a type alias for zencodec::GainMapParams (ultrahdr-core
# 0.5); opt in with `job-ultrahdr` for gain-map encode.
job = ["zennode", "std", "zencodecs/cms"]
# Opt-in: `job` plus gain-map (UltraHDR) encode via the zencodecs<->zenjpeg
# bridge. Roundtrip-tested (tests/gainmap_roundtrip.rs).
job-ultrahdr = ["job", "zencodecs/jpeg-ultrahdr"]
# JSON Schema / OpenAPI schema export from node registry.
json-schema = ["zennode", "zennode/json-schema", "zencodecs/zennode", "dep:serde_json"]
# Imageflow v2 compat: translate v2 Node/EncoderPreset/Framewise/Build001 to zen pipeline.
imageflow-compat = [
    "job", "nodes-filters", "nodes-png", "nodes-webp",
    "nodes-gif",
    "dep:imageflow_types", "dep:imageflow_riapi",
]

# ── Node registry features ──
# Each enables zennode + the codec dep for pipeline use.
# Codec/quantize node definitions now live in crate::zennode_defs.
nodes-jpeg = ["zennode", "dep:zenjpeg", "zencodecs/jpeg"]
nodes-png = ["zennode", "dep:zenpng", "zencodecs/png"]
nodes-webp = ["zennode", "dep:zenwebp", "zencodecs/webp"]
nodes-gif = ["zennode", "dep:zengif", "zencodecs/gif"]
nodes-avif = ["zennode", "dep:zenavif", "zencodecs/avif-decode"]
# AVIF backend + knob auto-tuning (`crate::avif_autotune`). OFF by default and
# flips no default: a caller opts in by holding an `AvifAutotune`.
#
# Decode, encode, and auto-tuning share the pinned zenavif 0.2 API.
avif-autotune = ["std", "dep:zenavif", "zenavif/auto-tune", "zenavif/encode-imazen", "dep:almost-enough", "dep:imgref", "dep:rgb"]
nodes-jxl = ["zennode", "dep:zenjxl", "zencodecs/jxl-decode"]
nodes-tiff = ["zennode", "dep:zentiff", "zencodecs/tiff"]
nodes-bmp = ["zennode", "dep:zenbitmaps", "zencodecs/bitmaps-bmp"]
# Geometry and resize nodes now live in zenpipe's own zennode_defs.
# These features are kept as backward-compatible aliases.
nodes-resize = ["zennode"]
nodes-layout = ["zennode"]
nodes-quant = ["zennode", "dep:zenquant"]
nodes-filters = ["zennode", "std", "zenfilters/zennode"]
nodes-faces = ["zennode", "std", "dep:zensally", "dep:zensally-zentract"]
# Lossless JPEG fast path for orient-only pipelines (~10x faster, zero gen loss).
# Uses zenjpeg::lossless::transform() on DCT coefficients.
lossless-jpeg = ["zennode", "dep:zenjpeg"]
nodes-heic = ["zennode", "zencodecs/heic-decode"]
nodes-all = [
    "nodes-jpeg", "nodes-png", "nodes-webp", "nodes-gif",
    "nodes-avif", "nodes-jxl", "nodes-tiff", "nodes-bmp",
    "nodes-resize", "nodes-layout", "nodes-quant", "nodes-filters",
    "nodes-heic",
]

[dependencies]
# Streaming resize (V-first, row push/pull, ring buffer)
zenresize = { version = "0.3.1", default-features = false }
# Image layout: constraint modes, orientation, smart crop
zenlayout = { workspace = true, features = ["smart-crop"] }
# Blend modes on premultiplied linear f32 RGBA rows (SIMD-accelerated)
zenblend = { version = "0.1.2", default-features = false }
# Pixel format descriptors and row-level conversion (transfer functions, gamut matrices, alpha)
zenpixels-convert.workspace = true
# Pixel buffer types, ColorContext, ICC/CICP metadata
zenpixels.workspace = true
# Codec trait abstraction (decode/encode, animation, streaming)
zencodec.workspace = true
# Cooperative cancellation
enough.workspace = true
# Slice/file/range/async drivers and the planned row encoder (`io` feature).
# Version edge: the core family comes from the root [patch.crates-io].
zencodec-io = { version = "0.1.0", optional = true }
# Blocking-pool bridge for async sources and writers (`io-tokio`).
tokio = { version = "1.53.3", default-features = false, features = ["rt", "sync", "io-util"], optional = true }
# Error location tracking (re-exported by zenpixels for BufferError)
whereat.workspace = true
# Linear ↔ sRGB color space conversion (LUT-based, no_std)
linear-srgb.workspace = true
# f32 ↔ u8 reinterpretation
bytemuck = { workspace = true, features = ["derive"] }
# HashMap for graph compilation
hashbrown = "0.16.1"
# Photo filters on planar Oklab f32 (SIMD-accelerated) — requires std
zenfilters = { workspace = true, optional = true }
# ICC color management (SIMD-accelerated, pure Rust) — requires std
moxcms = { version = ">=0.8.1, <0.10", optional = true }
# Self-documenting node definitions — bridges zennode types into PipelineGraph
zennode = { workspace = true, optional = true }
# Unified codec dispatch — node definitions for codec/quantize/quality-intent
zencodecs = { workspace = true, optional = true }

# ── Optional codec crates for node registry ──
# zenjpeg 0.9.0 (git main) dropped the no-op `decoder`/`trellis` features —
# both are always compiled now.
zenjpeg = { version = "0.9.0", features = ["zencodec"], optional = true }
zenpng = { version = "0.2.0", default-features = false, features = ["zencodec"], optional = true }
# zenwebp main made `zencodec` a required, always-on dependency (no cargo
# feature) as part of its Pattern B error boundary migration (zenwebp#69);
# its codec adapter module isn't std-gated, so no replacement feature is
# needed (unlike zengif below).
zenwebp = { version = "0.5.0", default-features = false, optional = true }
# zengif main made `zencodec` a required, always-on dependency (no longer an
# optional cargo feature) — the std-only codec glue it used to gate under the
# `zencodec` feature is now gated on plain `std` (which that feature always
# implied). Request `std` directly; `zencodec` is no longer a valid feature name.
zengif = { version = "0.8.0", default-features = false, features = ["std"], optional = true }
# The shared 0.2 codec contract; auto-tuning enables its native encoder.
zenavif = { version = "0.2.0", default-features = false, optional = true }
# `zenavif::encode_rgb8` takes an `almost_enough::StopToken`, so the
# `avif-autotune` consumer needs the type. Pinned to the exact version zenavif
# itself depends on so the two unify rather than resolving twice.
almost-enough = { version = "0.4.3", default-features = false, optional = true }
# The pixel-view types `zenavif::encode_rgb8` takes. Pinned to the exact
# versions zenavif itself depends on so the types UNIFY — a second resolution
# of either would make the call site fail to typecheck for a reason that reads
# like nonsense. (They are also dev-dependencies of this crate; that entry is
# for tests and does not reach the library.)
imgref = { version = "1.12.0", optional = true }
rgb = { version = "0.8.52", default-features = false, features = ["bytemuck"], optional = true }
zenjxl = { version = "0.3.0", default-features = false, features = ["zencodec"], optional = true }
zentiff = { version = "0.1.0", default-features = false, optional = true }
zenbitmaps = { version = "0.2.0", default-features = false, optional = true }
zenquant = { version = "0.1.2", default-features = false, optional = true }
# JSON serialization (optional — for schema export)
serde_json = { workspace = true, optional = true }
# Imageflow v2 compatibility (optional — for running legacy imageflow pipelines)
imageflow_types = { version = "0.1.0", optional = true }
imageflow_riapi = { version = "0.1.0", optional = true }
# Face detection + saliency via zentract plugin (optional)
zensally = { version = "0.1.0", default-features = false, features = ["zenlayout", "serde"], optional = true }
zensally-zentract = { version = "0.1.0", default-features = false, features = ["analyzer"], optional = true }

[dev-dependencies]
# Perceptual metric for the pristine_kernel_ab example only — dev-only, so it
# never enters the published dependency graph.
fast-ssim2 = { version = "0.8.2", features = ["imgref"] }
# Dev-deps enable extra features on the optional codec crates above.
# zenjpeg and zengif are used in integration tests (streaming_codec, bridge_codec).
zenjpeg = { version = "0.9.0", features = ["zencodec"] }
# `zencodec` is no longer a zengif feature (now a required dep) — see the
# comment on the main zengif dependency above. `std` is on by default here
# (default-features not disabled), so no explicit `std` needed.
zengif = { version = "0.8.0", features = ["quantizr"] }
zennode = { workspace = true }
serde_json.workspace = true
codec-corpus = "1"
imgref = "1.12"
rgb = { version = "0.8", features = ["as-bytes"] }
zenbench = "0.1.3"
zenbitmaps = { version = "0.2.0", features = ["bmp"] }

# Artifact-free 1/N downscale references from lossy corpus sources.
# Needs every decoder the imazen-26 corpus actually contains (jpg/heic/png) plus
# the formats a future variant source might use, and the resize node's crate.
# Settles pristine_downscale's --filter choice by measurement (rejection vs
# fidelity per kernel). fast-ssim2 is a dev-dependency: it never reaches the
# published crate's dependency graph.
[[example]]
name = "pristine_kernel_ab"
required-features = ["std", "nodes-png", "nodes-jpeg", "nodes-resize"]

[[example]]
name = "pristine_downscale"
required-features = ["std", "nodes-png", "nodes-jpeg", "nodes-heic", "nodes-resize"]

[[example]]
name = "bench_windowed"
required-features = ["std"]

[[example]]
name = "riapi_reference"
required-features = ["json-schema", "zennode"]

# Drives PyramidWriter / FsStore / ZipStore / TempFileSource, all `std`-gated.
[[example]]
name = "tile_pyramid_profile"
required-features = ["std"]

[[bench]]
name = "session_cache"
harness = false
required-features = ["zennode", "std"]

[workspace]
members = ["zencodecs", "zencodecs-cli", "zenfilters", "zenlayout", "zenpipe-cmd", "zeneditor", "tools/io-check"]
# `apidoc/` is the CI-free public-API snapshot runner: excluded so plain
# `cargo test` and every CI job never compile its dependency tree or run
# rustdoc. Regenerate via `just api-doc`.
# `demo/crate` is the WASM demo built standalone by the Pages workflow
# (nightly + build-std); without the exclusion cargo refuses to build it
# ("believes it's in a workspace when it's not").
# `wasm-size-shim` keeps its own Cargo.lock (standalone wasm size probe);
# excluded for the same reason as demo/crate.
exclude = ["apidoc", "demo/crate", "wasm-size-shim"]

[workspace.dependencies]
# ── Shared across 3+ members ──
enough = { version = "0.4", default-features = false }
whereat = { version = "0.1.5", default-features = false }
bytemuck = { version = "1.25", default-features = false, features = ["extern_crate_alloc"] }
linear-srgb = { version = "0.6.8", default-features = false }
zenpixels = { version = ">=0.2.17, <0.4.0", default-features = false }
zenpixels-convert = { version = ">=0.2.17, <0.4.0", default-features = false }
zencodec = { version = ">=0.2.0, <0.4.0", default-features = false }
# ── Serialization ──
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ── Workspace members ──
zenfilters = { path = "zenfilters", version = "0.1.0" }
zencodecs = { path = "zencodecs", version = "0.1.0", default-features = false }
zenlayout = { path = "zenlayout", version = "0.2.1", default-features = false }
# ── External path deps ──
zennode = { version = "0.1.1", default-features = false, features = ["derive"] }

# ── Git consumability (zenpipe#37) ──
# Every dependency above is a plain registry spec (`version = …`, no `path`),
# so this repo resolves from a bare `git clone` and as a
# `zenpipe = { git = … }` dependency. Crates whose required versions are NOT
# yet on crates.io are supplied below as git patches (same repos CI builds
# against). Local sibling-lockstep development is opt-in:
# `cargo superwork patch` adds path overrides, `unpatch` removes them — do not
# commit pathed manifests. CI (superwork ci-clone --add-paths) deletes this
# section (see delete_sections below) and paths every dep to its sibling
# clone; the Pages deploy regenerates it via ci-prep. NOTE: [patch] only
# applies from the top-level workspace — git consumers of zenpipe that enable
# features needing these crates must mirror the relevant entries.
[patch.crates-io]
# The optional AVIF tuner resolves this unpublished predictor from the same workspace.
zenpredict = { git = "https://github.com/imazen/zenanalyze", rev = "6bbcacb11313923ded6e5eeebb725878c5736453" }
zenresize = { git = "https://github.com/imazen/zenresize", rev = "5b4e14e33a1cd49bd9e08287858d2f534526ac25" }
# Optional borrowed Pulse family; source alignment only, original locks retained.
# Dependencies use version edges, so each consumer root selects this source.
zencodec = { git = "https://github.com/imazen/zencodec", rev = "eeb1a4504c9ed83dd27a9459107260d0a78a47fb" }
zencodec-io = { git = "https://github.com/imazen/zencodec", rev = "eeb1a4504c9ed83dd27a9459107260d0a78a47fb" }
zencodec-coroutine = { git = "https://github.com/imazen/zencodec", rev = "eeb1a4504c9ed83dd27a9459107260d0a78a47fb" }
zenmeta = { git = "https://github.com/imazen/zencodec", rev = "eeb1a4504c9ed83dd27a9459107260d0a78a47fb" }
# Transitive source prerequisites: dependency patch tables do not propagate.
zenflate = { git = "https://github.com/imazen/zenflate", rev = "a0ea03637a2cc9a193e343018ae2cfb1a6c31edd" }
tiff = { git = "https://github.com/lilith/image-tiff", rev = "10a3b6b2fa88eb5943525066a989ea9e64e644d5" }
hayro-syntax = { git = "https://github.com/lilith/hayro", rev = "2ce50d0164878b8505e118f81dcb1d0367b26957" }
# Optional borrowed Pulse JPEG source; consumer qualification remains unrun.
zenjpeg = { git = "https://github.com/imazen/zenjpeg", rev = "c73a3cc90997c0553832243daba383ac3086dc98" }
# Retained HEIC source still needs its owned-Pulse adapter migration.
# Keep its full-profile/API feature and existing assertions enabled.
heic = { git = "https://github.com/imazen/heic", rev = "c67cffe461ade38e4ca1c9bb36175dc67e724c07" }
# Optional-control TIFF source with the matching image-tiff resource-limit fork.
# Consumer resolution, pixel parity and native qualification remain pending.
zentiff = { git = "https://github.com/imazen/zenextras", rev = "403d46b9973a58b212def0602f4dd8cdee9560dc" }
# Prepared row conversion with current color context (zenpixels PR 92).
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "f23ac7535be1144a22d0dc6b71f866a08b151f34" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "f23ac7535be1144a22d0dc6b71f866a08b151f34" }
# The consumed ultrahdr-core package uses version edges for shared types.
# Match the source selected by the optional-control codec roots.
ultrahdr-core = { git = "https://github.com/imazen/ultrahdr", rev = "7e9d296c9e037e626234c9f0e8673d48278f83f0" }
# zenjxl main carries the `jpeg-lossy` feature (JPEG→JXL coefficient-domain
# transcode); the published 0.2.1 predates it.
zenjxl = { git = "https://github.com/imazen/zenjxl", rev = "a76ac76d080295b754d970a3392eed8f964de490" }
# jxl-encoder 0.3.2 (lossy-JPEG recompression API) is not yet on crates.io.
jxl-encoder = { git = "https://github.com/imazen/jxl-encoder", rev = "3c1be8179ac7fdb7e7322e299cdad645046acf6c" }
# zenjxl-decoder main has the mode-aware orientation API zenjxl main's adapter
# uses; 0.3.10 on crates.io predates it (same version number, older content).
zenjxl-decoder = { git = "https://github.com/imazen/zenjxl-decoder", rev = "ce1a28b41b71b66b19240dce0d1b6f0579c8064d" }
# Optional borrowed Pulse WebP source; consumer qualification remains unrun.
zenwebp = { git = "https://github.com/imazen/zenwebp", rev = "d5893295cc7562002017980b44753bf3237a89f3" }
# Optional borrowed Pulse PNG source with its required zenflate source patch.
# Consumer lock resolution and native qualification remain pending.
zenpng = { git = "https://github.com/imazen/zenpng", rev = "7b6d1436db5d771fc43226c146847fc76305afde" }
# zennode main has NodeRole variants (DisplayAdjust, ToneMap, …) the published
# 0.1.1 predates (same version number, older content).
zennode = { git = "https://github.com/imazen/zennode" }
zennode-derive = { git = "https://github.com/imazen/zennode" }
# zensim 0.3.0 / zensim-regress 0.4.0 are unpublished (crates.io: 0.2.7 / 0.3.1).
zensim = { git = "https://github.com/imazen/zensimx", rev = "8557758809156baba7364bd8cfe32889a61da4e8" }
zensim-regress = { git = "https://github.com/imazen/zensimx", rev = "8557758809156baba7364bd8cfe32889a61da4e8" }
# zenanalyze-api 0.1.0 IS on crates.io (zencodecs declares it from the registry),
# but zenpicker/zenpredict (git mains, unpublished) pull THEIR copy from the
# zenanalyze git checkout via an internal `{ version, path }` dep — so a bare
# registry zenanalyze-api in zencodecs would be a SECOND instance and the
# `zenanalyze_api::Offer`/`Request` contract wouldn't typecheck across the picker
# boundary (verified: E0308). Patch the registry crate to the same git source to
# unify to one instance. Drop this once zenpicker/zenpredict publish (then every
# edge resolves zenanalyze-api from the registry).
#
# MEASURED 2026-09-04 — WHAT "ONE INSTANCE" ACTUALLY REQUIRES, AND THE TRAP.
# The floating git spec here and the floating `zenpicker`/`zenpredict` git deps
# in zencodecs/Cargo.toml all name the SAME repo, so a clean resolve converges
# them on ONE checkout and yields exactly ONE zenanalyze-api. That is the whole
# mechanism — there is nothing else to configure. But it is only true of a
# FRESHLY RESOLVED lock: `Cargo.lock` records the rev each entry was locked at,
# and entries locked at different times drift onto DIFFERENT revs of this repo.
# When they do, the graph carries two checkouts and cargo does not report a
# version conflict — it dies with a bogus-looking internal error:
#   error: failed to download `zenanalyze-api v0.1.1 (…zenanalyze#<revA>)`
#   Caused by: failed to find zenanalyze-api v0.1.1 (…) in path source
#   note: this is an unexpected cargo internal error
# That message names neither the second rev nor the real cause. Do NOT read it
# as a manifest conflict, and do NOT "fix" it by re-pinning revs or converting
# this entry to a path — both move the duplicate rather than removing it.
# THE FIX IS A LOCK RE-RESOLVE, and it is three lines of diff:
#   cargo update -p 'git+https://github.com/imazen/zenanalyze#zenpicker@0.1.0' \
#                -p 'git+https://github.com/imazen/zenanalyze#zenpredict@0.2.0'
# Verify with: `grep -c 'name = "zenanalyze-api"' Cargo.lock` — it must print 1.
# (2026-09-04 this had drifted to zenanalyze-api@6b080abf vs
# zenpicker/zenpredict@7b84d53c, which broke `--features picker-api` and
# `--features avif-autotune` outright; converged to #f7fe3435, zero manifest
# changes, `cargo public-api` delta ZERO for both zenpipe and zencodecs.)
#
# WHY THE REGISTRY 0.1.0 IS NOT ENOUGH TODAY (the reason this entry still
# exists). zenanalyze-api is FROZEN at 0.1.x by policy (zenanalyze CLAUDE.md,
# user directive 2026-07-19) and the sibling is 0.1.1 — an ADDITIVE patch
# release whose only public-surface delta over the published 0.1.0 is
# `Select::Names`, a new variant on an already `#[non_exhaustive]` enum (item
# diff vs the published crate is EMPTY, so the frozen contract is intact).
# zenanalyze 0.2.x MATCHES on that variant (zenanalyze/src/offer.rs) and
# requires `^0.1.1`, which crates.io cannot satisfy. Publishing zenanalyze-api
# 0.1.1 is therefore all that stands between this graph and a registry-only
# resolve; `FeatureProvider`, cited by older comments as the blocking addition,
# was CUT before 0.1.1 (zenanalyze 62bfd43) and has no consumers.
zenanalyze-api = { git = "https://github.com/imazen/zenanalyze", rev = "6bbcacb11313923ded6e5eeebb725878c5736453" }
# zenanalyze itself: git-only forever. Its main is 0.2.0 (the `hdr` feature /
# retired `composites`), while the registry tops out at 0.1.0 and stays there —
# zenanalyze's public API is frozen at 0.1.x by policy, so 0.2.x only exists on
# git. zenjpeg 147444fe (2026-08-29) moved its own zenanalyze dep from a git rev
# pin to a crates.io VERSION resolved through a [patch.crates-io] at the ZENJPEG
# workspace root — the right shape there, because one root patch unifies the
# `zenanalyze_api::Offer` contract across every consumer where per-manifest rev
# pins had produced several incompatible `Offer` types in one graph. But a
# dependency's [patch] table is ignored when that dependency is consumed from
# outside its own workspace, which is exactly how we consume zenjpeg (git patch
# above). So the moment 147444fe landed, every fresh resolve of this graph asked
# crates.io for `zenanalyze ^0.2.0` and died before compiling a line:
#   error: failed to select a version for the requirement `zenanalyze = "^0.2.0"`
#   candidate versions found which didn't match: 0.1.0
# That took down the Pages deploy (runs 33229080325 / 33230408160), which deletes
# Cargo.lock and re-resolves from scratch; committed locks still pointed at the
# pre-147444fe zenjpeg and hid it locally. Fix: carry the sibling's patch here —
# same shape and same reason as zenjxl 1ae0da79. Floating (no rev) like every
# other entry in this table on purpose: a rev pin would strand us the next time
# zenjpeg's main bumps its zenanalyze requirement.
zenanalyze = { git = "https://github.com/imazen/zenanalyze", rev = "6bbcacb11313923ded6e5eeebb725878c5736453" }
# imageflow_types / imageflow_riapi are not published (imageflow-compat feature).
imageflow_types = { git = "https://github.com/imazen/imageflow" }
imageflow_riapi = { git = "https://github.com/imazen/imageflow" }
# zensally / zensally-zentract are not published (nodes-faces feature).
zensally = { git = "https://github.com/imazen/zensally" }
zensally-zentract = { git = "https://github.com/imazen/zensally" }
# Bitmap/QOI optional-control source; consumer qualification remains unrun.
zenbitmaps = { git = "https://github.com/imazen/zenbitmaps", rev = "5abfba282057f8e3eb4ab5bcc0e7c4ee5fe6146c" }
# zengif main (0.7.3, unreleased-beyond-tag content) adopted the zencodec
# Pattern B error boundary (`type Error = At<zencodec::CodecError>`) and made
# `zencodec` a required, always-on dependency (zengif#13); crates.io 0.7.3
# predates both changes.
zengif = { git = "https://github.com/imazen/zengif", rev = "a258e93c5bc0b0a5624b521d7103a34b472c5ac9" }
# AVIF/parse/MP4 optional-control source, matching the direct parser edge.
# Its rav1d-safe source stays b19aec65; orientation expectations are unchanged.
# This consumer graph is unbuilt.
zenavif = { git = "https://github.com/imazen/zenavif", rev = "f0a3919eb051cd85d204ac6592e5333b067498ef" }
# Application-root selection for zenravif's unpublished registry serializer.
zenavif-serialize = { git = "https://github.com/imazen/zenavif", rev = "f0a3919eb051cd85d204ac6592e5333b067498ef" }
# RAW optional-Pulse adapter; full-profile compilation is qualified.
# Full corpus/platform qualification remains separate.
zenraw = { git = "https://github.com/imazen/zenraw", rev = "799ac0a1fd9cba997f4c054d3cf4a5d0ec0a2e16" }
# Optional-control PDF source with its matching hayro-syntax resource-limit fork.
# Full consumer qualification remains pending.
zenpdf = { git = "https://github.com/imazen/zenextras", rev = "403d46b9973a58b212def0602f4dd8cdee9560dc" }

# Override zenresize's git dep on zenlayout to use our workspace copy
[patch."https://github.com/imazen/zenlayout.git"]
zenlayout = { path = "zenlayout" }

[package.metadata.superwork.ci]
strategy = "strip_path"
delete = ["imageflow_types", "imageflow_riapi", "zensally", "zensally-zentract"]
# CI resolves every internal dep to its ci-clone sibling checkout; the git
# patches above exist for bare-clone/registry resolution and would only make
# every CI job fetch those repos redundantly (ci-lint convention).
delete_sections = ["patch.crates-io"]
