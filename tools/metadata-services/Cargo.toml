[package]
name = "zencodecs-metadata-services"
version = "0.0.0"
edition = "2024"
rust-version = "1.93"
publish = false

# Application-level example/test harness. These dependencies never enter the
# zencodecs library graph. The application supplies Services at runtime.
[workspace]

[features]
default = []
cli = ["dep:zencodecs"]

[[bin]]
name = "zencodecs-metadata-services"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
zencodecs = { path = "../../zencodecs", optional = true, default-features = false, features = ["std", "jpeg", "metadata"] }
zencodec = { version = ">=0.1.26, <0.3.0" }
zenmeta = { git = "https://github.com/imazen/zencodec", default-features = false, features = ["xmp"] }
zenpixels-convert = { version = ">=0.2.17, <0.4.0", default-features = false }
xmpkit = { version = "=0.1.6", default-features = false, features = ["core"] }
roxmltree = { version = "0.21.1", default-features = false, features = ["positions"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
brotli = "8.0.4"
quick-xml = "0.38.4"
enough = "0.4.4"

# Mirrors the workspace root table (cargo honours [patch] only from the
# building workspace root; this harness is its own workspace).
[patch.crates-io]
# The same git source as zenmeta, so its in-repo `zencodec` path dependency and
# the registry requirement of every codec unify into one zencodec.
zencodec = { git = "https://github.com/imazen/zencodec" }
zenjpeg = { git = "https://github.com/imazen/zenjpeg" }
heic = { git = "https://github.com/imazen/heic" }
zentiff = { git = "https://github.com/imazen/zenextras" }
zenpixels = { git = "https://github.com/imazen/zenpixels" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels" }
ultrahdr-core = { git = "https://github.com/imazen/ultrahdr" }
zenjxl = { git = "https://github.com/imazen/zenjxl" }
jxl-encoder = { git = "https://github.com/imazen/jxl-encoder" }
zenjxl-decoder = { git = "https://github.com/imazen/zenjxl-decoder" }
zenwebp = { git = "https://github.com/imazen/zenwebp" }
zenpng = { git = "https://github.com/imazen/zenpng" }
zennode = { git = "https://github.com/imazen/zennode" }
zennode-derive = { git = "https://github.com/imazen/zennode" }
zensim = { git = "https://github.com/imazen/zensim" }
zensim-regress = { git = "https://github.com/imazen/zensim" }
zenanalyze-api = { git = "https://github.com/imazen/zenanalyze" }
zenanalyze = { git = "https://github.com/imazen/zenanalyze" }
zenpredict = { git = "https://github.com/imazen/zenanalyze" }
imageflow_types = { git = "https://github.com/imazen/imageflow" }
imageflow_riapi = { git = "https://github.com/imazen/imageflow" }
zensally = { git = "https://github.com/imazen/zensally" }
zensally-zentract = { git = "https://github.com/imazen/zensally" }
zenbitmaps = { git = "https://github.com/imazen/zenbitmaps" }
zengif = { git = "https://github.com/imazen/zengif" }
zenavif = { git = "https://github.com/imazen/zenavif", rev = "5e493d39bb0b1e60e79ef755d0734e5bc30313ac" }
zenraw = { git = "https://github.com/imazen/zenraw" }
zenpdf = { git = "https://github.com/imazen/zenextras" }
