[package]
name = "zencodecs-metadata-services"
version = "0.0.0"
edition = "2024"
rust-version = "1.93"
publish = false

# Application-level example/test harness. These dependencies never enter the
# zencodecs library graph. The application supplies Services at runtime.
[workspace]

[features]
default = []
cli = ["dep:zencodecs"]

[[bin]]
name = "zencodecs-metadata-services"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
zencodecs = { path = "../../zencodecs", optional = true, default-features = false, features = ["std", "jpeg", "metadata"] }
zencodec = { version = ">=0.3.0, <0.4.0" }
zenmeta = { version = "0.2.0", features = ["xmp"] }
zenpixels = { version = ">=0.5.0, <0.6.0", default-features = false }
zenpixels-convert = { version = ">=0.5.0, <0.6.0", default-features = false }
xmpkit = { version = "=0.1.6", default-features = false, features = ["core"] }
roxmltree = { version = "0.21.1", default-features = false, features = ["positions"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
brotli = "8.0.4"
quick-xml = "0.38.4"
enough = "0.4.4"

# Mirrors the workspace root table (cargo honours [patch] only from the
# building workspace root; this harness is its own workspace).
[patch.crates-io]
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "7fa068834f8074c2630a352b25f355f7c90751f8" }
