[package]
name = "jxl-editor-zensr"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zensr-micro = { git = "https://github.com/imazen/zensr", rev = "4a33019", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"

[profile.release]
lto = "thin"
strip = "debuginfo"

[profile.test]
debug = 0
incremental = false
