[package]
name = "jxl-editor-decoders"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
simd128 = ["jxl/simd128", "zenjxl-decoder/wasm128"]

[dependencies]
jxl = { version = "0.8.0", default-features = false, features = ["brotli"] }
jxl-oxide = { version = "0.12.6", default-features = false, features = ["moxcms"] }
moxcms = "0.8.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zenjxl-decoder = { git = "https://github.com/imazen/zenjxl-decoder", rev = "025852d2d13dc49b42fc484703d8c5bf6f4fa013", default-features = false, features = ["cms", "jpeg"] }

[dev-dependencies]
jxl-encoder = { git = "https://github.com/imazen/jxl-encoder", rev = "459e86b79b3ea15ab3575404c8faae5db4c2c399", default-features = false, features = ["std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"

[profile.release]
lto = "thin"
strip = "debuginfo"

[profile.test]
debug = 0
incremental = false
