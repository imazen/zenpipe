[package]
name = "zencodecs-jpeg-png-consumer"
version = "0.0.0"
edition = "2024"
rust-version = "1.93"
publish = false
description = "Frozen consumer graph for zencodec's checked JPEG/PNG guide"

# A consumer outside this repository: its own workspace, git revisions only.
# [patch] applies only from the top-level workspace, so a git consumer of
# zencodecs repeats the pins below; nothing points at a sibling checkout.
[workspace]

[dependencies]
zencodec = { version = "0.2.0", features = ["std"] }
zencodec-io = { git = "https://github.com/imazen/zencodec", rev = "79676215c037bf222c414198813e4b4f6b6efb96", features = ["std", "tokio"] }
zencodecs = { git = "https://github.com/imazen/zenpipe", rev = "@ZENPIPE_REV@", default-features = false, features = ["std", "cms", "jpeg", "png", "checked-transcode-async"] }
zenpixels = ">=0.2.16, <0.4.0"
zenpixels-convert = { version = ">=0.2.16, <0.4.0", features = ["cms-moxcms"] }

[patch.crates-io]
# zencodec 0.2 (the Pulse contract and shared encode-planning hooks) is unpublished.
zencodec = { git = "https://github.com/imazen/zencodec", rev = "79676215c037bf222c414198813e4b4f6b6efb96" }
# The native JPEG/PNG review branches that implement it.
zenjpeg = { git = "https://github.com/imazen/zenjpeg", rev = "8672e549793a7e1b515f292bd9fd77109118cb83" }
zenpng = { git = "https://github.com/imazen/zenpng", rev = "5422b6d213e41f9764e7c4cf98e5c44eb8acbd85" }
# Prepared row conversion with current color context, as the codecs pin it.
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "f8596aae7a16aec7875b6fe2ef39b501c11a0e82" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "f8596aae7a16aec7875b6fe2ef39b501c11a0e82" }
